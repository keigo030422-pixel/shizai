<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>品目別 資材ビューア</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Hiragino Sans','Yu Gothic',system-ui,sans-serif;
         background:#F3F1EA; color:#2B2A24; -webkit-text-size-adjust:100%; }
  #app { display:flex; flex-direction:column; min-height:100vh; }
  .header { background:#EAE6D9; border-bottom:1px solid #D8D2C0; padding:14px 16px; }
  .header h1 { margin:0 0 2px; font-size:17px; }
  .header p { margin:0; font-size:11px; color:#8A8371; }
  .search-wrap { padding:10px 12px; background:#EAE6D9; border-bottom:1px solid #D8D2C0; }
  .search-wrap input { width:100%; padding:9px 12px; border-radius:8px;
                       border:1px solid #D8D2C0; font-size:14px; }
  .cats { padding:8px 12px; background:#EAE6D9; border-bottom:1px solid #D8D2C0;
          display:flex; flex-wrap:wrap; gap:6px; }
  .cat-btn { padding:5px 11px; border-radius:999px; font-size:12px;
             border:1px solid #D8D2C0; background:#fff; color:#5A5648; cursor:pointer; }
  .cat-btn.active { color:#fff; border-color:transparent; }
  .list { flex:1; overflow-y:auto; background:#EAE6D9; }
  .cat-head { padding:6px 16px; font-size:11px; font-weight:bold; display:flex;
              align-items:center; gap:6px; background:#EAE6D9; position:sticky; top:0; }
  .dot { width:7px; height:7px; border-radius:999px; display:inline-block; }
  .item-btn { width:100%; text-align:left; padding:11px 16px; font-size:14px;
              background:none; border:none; border-left:3px solid transparent;
              display:flex; justify-content:space-between; align-items:center;
              color:#5A5648; cursor:pointer; }
  .item-btn .thumb { width:22px; height:22px; border-radius:4px; object-fit:cover; margin-right:8px; }
  .item-btn .left { display:flex; align-items:center; }
  .item-btn .count { font-size:11px; opacity:.5; }
  .detail { padding:16px; max-width:820px; margin:0 auto; width:100%; }
  .back-btn { background:none; border:none; font-size:14px; font-weight:600;
              padding:4px 0 12px; cursor:pointer; }
  .badges { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .badge { font-size:11px; padding:4px 10px; border-radius:999px; }
  .badge.plain { background:#fff; border:1px solid #D8D2C0; color:#5A5648; }
  .imgbox { width:100%; max-width:260px; aspect-ratio:1; background:#fff;
            border:1px solid #D8D2C0; border-radius:14px; display:flex;
            align-items:center; justify-content:center; overflow:hidden; margin-bottom:10px; }
  .imgbox img { width:100%; height:100%; object-fit:cover; }
  .placeholder { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .placeholder .circle { width:60px; height:60px; border-radius:999px; display:flex;
                         align-items:center; justify-content:center; font-size:22px; font-weight:bold; }
  .placeholder span { font-size:11px; color:#9A9382; }
  .btnrow { display:flex; gap:8px; max-width:260px; margin-bottom:8px; }
  .btn { flex:1; display:block; padding:11px; border-radius:8px; border:none;
         font-size:13px; font-weight:600; color:#fff; cursor:pointer; text-align:center; }
  .btn.ghost { background:#fff; border:1px solid #D8D2C0; color:#9A5A4A; }
  .btn.outline { background:#fff; border:1px solid currentColor; }
  h2.title { font-size:24px; margin:12px 0 4px; }
  p.meta { font-size:13px; color:#8A8371; margin:0 0 12px; }
  .memo { font-size:12px; padding:10px 12px; border-radius:8px; white-space:pre-line;
          background:#FBF6E3; border:1px solid #EAD9A0; color:#7A6420; margin-bottom:16px; }
  .matgroup { background:#fff; border:1px solid #E3DFD1; border-radius:10px;
              margin-bottom:14px; overflow:hidden; }
  .matgroup .gh { padding:9px 14px; font-size:13px; font-weight:bold; }
  .matrow { padding:11px 14px; border-top:1px solid #F0EDE2; display:flex; gap:10px; align-items:flex-start; }
  .matgroup .matrow:first-of-type { border-top:none; }
  .matthumb { width:52px; height:52px; border-radius:6px; object-fit:cover;
              border:1px solid #E3DFD1; flex-shrink:0; background:#F7F5EE; }
  .matthumb.empty { display:flex; align-items:center; justify-content:center;
                    font-size:10px; color:#B5AF9E; text-align:center; line-height:1.2; }
  .matbody { flex:1; min-width:0; }
  .matname { font-size:14px; font-weight:500; }
  .tag { font-size:10px; font-weight:bold; padding:2px 6px; border-radius:4px; margin-left:6px; }
  .supplier { font-size:12px; color:#9A9382; margin-top:3px; }
  .matactions { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .minibtn { font-size:11px; padding:4px 9px; border-radius:6px; background:#fff;
             border:1px solid #D8D2C0; color:#5A5648; cursor:pointer; }
  .status { font-size:12px; padding:8px 12px; border-radius:8px; margin-bottom:10px; max-width:400px; }
  .status.err { background:#FDECE4; color:#B5552F; }
  .status.ok { background:#E7F1E4; color:#3F7D4A; }
  .status.info { background:#EFEDE4; color:#6B6558; }
  .hidden { display:none !important; }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:50;
              display:flex; align-items:flex-end; justify-content:center; }
  .modal { background:#F3F1EA; width:100%; max-width:520px; border-radius:16px 16px 0 0;
           padding:18px 16px 24px; max-height:88vh; overflow-y:auto; }
  .modal h3 { margin:0 0 14px; font-size:16px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:12px; font-weight:600; margin-bottom:5px; color:#5A5648; }
  .field input, .field select, .field textarea {
    width:100%; padding:9px 11px; border-radius:8px; border:1px solid #D8D2C0;
    font-size:14px; background:#fff; font-family:inherit; }
  .field textarea { min-height:64px; resize:vertical; }
  .modal-actions { display:flex; gap:8px; margin-top:16px; }
  .addbar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .gallery { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px; }
  .gcard { flex:0 0 auto; width:190px; }
  .gimg { width:190px; height:190px; background:#fff; border:1px solid #D8D2C0;
          border-radius:12px; overflow:hidden; display:flex;
          align-items:center; justify-content:center; }
  .gimg img { width:100%; height:100%; object-fit:cover; cursor:zoom-in; }
  .matthumb { cursor:zoom-in; }
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:100;
              display:flex; align-items:center; justify-content:center; padding:16px; }
  .lightbox img { max-width:100%; max-height:100%; object-fit:contain;
                  border-radius:6px; }
  .lbclose { position:absolute; top:14px; right:16px; width:40px; height:40px;
             border-radius:999px; border:none; background:rgba(255,255,255,.9);
             color:#2B2A24; font-size:18px; cursor:pointer; }
  .gacts { display:flex; gap:6px; margin-top:6px; }
  .gacts .minibtn { flex:1; text-align:center; }
  .editor-bg { position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:80;
               display:flex; align-items:center; justify-content:center; padding:12px; }
  .editor { background:#F3F1EA; border-radius:14px; padding:12px;
            max-width:800px; width:100%; max-height:94vh; overflow-y:auto; }
  .etoolbar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .etool { padding:7px 13px; border-radius:8px; font-size:13px; font-weight:600;
           background:#fff; border:1px solid #D8D2C0; color:#5A5648; cursor:pointer; }
  .etool.active { background:#3F7D4A; color:#fff; border-color:#3F7D4A; }
  .ecolors { display:flex; gap:5px; }
  .ecolor { width:26px; height:26px; border-radius:999px; border:2px solid #D8D2C0; cursor:pointer; padding:0; }
  .ecolor.active { border-color:#2B2A24; transform:scale(1.15); }
  .esizes { display:flex; gap:5px; margin-left:auto; }
  .esize { padding:6px 10px; border-radius:7px; font-size:12px; background:#fff;
           border:1px solid #D8D2C0; color:#5A5648; cursor:pointer; }
  .esize.active { background:#5A5648; color:#fff; border-color:#5A5648; }
  .ebtn { padding:6px 12px; border-radius:7px; font-size:12px; background:#fff;
          border:1px solid #D8D2C0; color:#5A5648; cursor:pointer; }
  .ecanvas-wrap { display:flex; justify-content:center; background:#2B2A24;
                  border-radius:10px; padding:8px; margin-bottom:6px; position:relative; }
  .elive { position:absolute; margin:0; padding:0 2px; background:transparent;
           border:1px dashed rgba(25,113,194,.9); border-radius:3px;
           outline:none; resize:none; overflow:hidden; white-space:pre;
           font-weight:bold; line-height:1.25; z-index:5;
           font-family:'Hiragino Sans','Yu Gothic',sans-serif;
           caret-color:#1971C2; }
  .ehint { font-size:11px; color:#8A8371; margin:0 0 10px; }
  #ecanvas { max-width:100%; touch-action:none; border-radius:6px; cursor:crosshair; }
  .eactions { display:flex; gap:8px; }
  .eactions .btn { flex:1; }
  .picker { max-height:210px; overflow-y:auto; border:1px solid #D8D2C0;
            border-radius:8px; background:#fff; }
  .pitem { width:100%; display:flex; gap:9px; align-items:center; text-align:left;
           padding:8px 10px; background:none; border:none;
           border-bottom:1px solid #F0EDE2; cursor:pointer; }
  .pitem:last-child { border-bottom:none; }
  .pitem.sel { background:#E7F1E4; }
  .pthumb { width:38px; height:38px; border-radius:5px; object-fit:cover;
            border:1px solid #E3DFD1; flex-shrink:0; background:#F7F5EE; }
  .pthumb.empty { display:flex; align-items:center; justify-content:center;
                  font-size:9px; color:#B5AF9E; text-align:center; line-height:1.15; }
  .pbody { display:flex; flex-direction:column; min-width:0; }
  .pname { font-size:13px; font-weight:500; color:#2B2A24; }
  .pmeta { font-size:11px; color:#9A9382; margin-top:2px; }
  @media (min-width:768px) {
    #app { flex-direction:row; height:100vh; }
    .sidebar { width:320px; flex-shrink:0; border-right:1px solid #D8D2C0;
               display:flex; flex-direction:column; }
    .main { flex:1; overflow-y:auto; }
    .back-btn { display:none; }
    .sidebar, .main { display:flex !important; }
    .detail { padding:28px; }
    .modal-bg { align-items:center; }
    .modal { border-radius:16px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="sidebar" id="sidebar">
    <div class="header">
      <h1>品目別 資材ビューア</h1>
      <p>商品を選ぶと使用資材が一覧表示されます</p>
      <p style="margin-top:3px">※ 登録内容は全員に共有されます</p>
      <button id="showbin" class="minibtn" style="margin-top:6px">保存先IDを表示</button>
      <p id="binout" style="margin-top:5px; font-family:monospace; font-size:11px;
         word-break:break-all; color:#3F7D4A"></p>
    </div>
    <div class="search-wrap">
      <input id="search" type="text" placeholder="品目名で検索..." />
    </div>
    <div class="cats" id="cats"></div>
    <div class="list" id="list"></div>
  </div>
  <div class="main hidden" id="main"></div>
</div>
<div id="modalRoot"></div>

  return [...new Set(used.concat(pendingCats))];
}

// ---------- storage ----------
// One fixed bin for the whole team. There is deliberately no per-device
// fallback: if a phone were allowed to invent its own bin, that person would
// silently get a private copy and nobody would see their photos.
async function ensureBin() { return BIN_ID; }

async function loadAll() {
  try {
    const id = BIN_ID;
    const res = await fetch("https://api.jsonbin.io/v3/b/" + id + "/latest", {
      headers:{ "X-Master-Key":JSONBIN_KEY }
    });
    const d = await res.json();
    if (res.ok && d.record) {
      rows = Array.isArray(d.record.rows) && d.record.rows.length ? d.record.rows : SEED.slice();
      itemPhotos = d.record.itemPhotos || {};
      migratePhotos();
      matPhotos = d.record.matPhotos || {};
    } else {
      rows = SEED.slice();
    }
  } catch (e) {
    console.error(e);
    rows = SEED.slice();
  }
  refreshItems();
  render();
}

async function saveAll() {
  const id = await ensureBin();
  const res = await fetch("https://api.jsonbin.io/v3/b/" + id, {
    method:"PUT",
    headers:{ "Content-Type":"application/json", "X-Master-Key":JSONBIN_KEY },
    body: JSON.stringify({ rows, itemPhotos, matPhotos })
  });
  if (!res.ok) {
    let msg = "保存に失敗";
    try { const d = await res.json(); msg = d.message || msg; } catch(e){}
    throw new Error(msg);
  }
}

async function withSave(fn, okMsg) {
  busy = true; status = null; render();
  try {
    await fn();
    await saveAll();
    status = { type:"ok", msg: okMsg || "保存しました" };
  } catch (e) {
    console.error(e);
    status = { type:"err", msg: "エラー: " + e.message };
  } finally {
    busy = false; refreshItems(); render();
  }
}

// ---------- image upload ----------
function shrink(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error("読み込み失敗"));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("画像を読めません"));
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL("image/jpeg", quality).split(",")[1]);
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

async function uploadImage(file) {
  const b64 = await shrink(file, 1200, 0.82);
  const fd = new FormData();
  fd.append("image", b64);
  const res = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_KEY, { method:"POST", body:fd });
  const d = await res.json();
  if (!d || !d.success) throw new Error("画像アップロードに失敗");
  return d.data.url;
}

// Opens a file input. useCamera=true asks the OS for the camera directly.
function pickFile(useCamera) {
  return new Promise(resolve => {
    const inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "image/*";
    if (useCamera) inp.setAttribute("capture", "environment");
    inp.style.display = "none";
    document.body.appendChild(inp);
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      document.body.removeChild(inp);
      resolve(f || null);
    };
    inp.click();
  });
}

// ---------- photo annotation editor ----------
// Opens after a photo is picked (or from "書き込む" on an existing photo).
// `existing` are marks from a previous session, so they can be edited or
// removed rather than being permanently burned into the image.
// Resolves to { blob, marks } or null if cancelled.
function annotateImage(src, existing) {
  return new Promise(resolve => {
    const wrap = document.createElement("div");
    wrap.className = "editor-bg";
    wrap.innerHTML =
      '<div class="editor">' +
        '<div class="etoolbar">' +
          '<button class="etool active" data-tool="arrow">矢印</button>' +
          '<button class="etool" data-tool="rect">囲み</button>' +
          '<button class="etool" data-tool="text">文字</button>' +
        '</div>' +
        '<div class="etoolbar">' +
          '<span class="ecolors">' +
            '<button class="ecolor active" data-color="#E03131" style="background:#E03131"></button>' +
            '<button class="ecolor" data-color="#1971C2" style="background:#1971C2"></button>' +
            '<button class="ecolor" data-color="#2F9E44" style="background:#2F9E44"></button>' +
            '<button class="ecolor" data-color="#F08C00" style="background:#F08C00"></button>' +
            '<button class="ecolor" data-color="#FFFFFF" style="background:#FFFFFF"></button>' +
            '<button class="ecolor" data-color="#000000" style="background:#000000"></button>' +
          '</span>' +
          '<span class="esizes">' +
            '<button class="esize" data-size="3">細</button>' +
            '<button class="esize active" data-size="6">中</button>' +
            '<button class="esize" data-size="11">太</button>' +
          '</span>' +
          '<button class="ebtn" id="eundo">戻す</button>' +
          '<button class="ebtn" id="etext">文字を直す</button>' +
          '<button class="ebtn" id="edel" style="color:#B5552F">選択を削除</button>' +
          '<button class="ebtn" id="eclear" style="color:#B5552F">全消し</button>' +
        '</div>' +
        '<div class="ecanvas-wrap"><canvas id="ecanvas"></canvas></div>' +
        '<p class="ehint" id="ehint"></p>' +
        '<div class="eactions">' +
          '<button class="btn" id="ecancel" style="background:#fff;border:1px solid #D8D2C0;color:#5A5648">キャンセル</button>' +
          '<button class="btn" id="edone" style="background:#3F7D4A">この内容で登録</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap);

    const canvas = wrap.querySelector("#ecanvas");
    const ctx = canvas.getContext("2d");
    const img = new Image();
    img.crossOrigin = "anonymous";

    let tool = "arrow", stroke = "#E03131", size = 6;
    let strokes = [];  // filled in once the image size is known (see img.onload)

    // Marks are saved relative to the photo (0..1 across its width/height, and
    // values outside that range sit in the margin), so they land in the right
    // spot no matter what size the canvas is next time it opens.
    function denorm(s) {
      const o = JSON.parse(JSON.stringify(s));
      const X = v => PAD + v * imgW, Y = v => PAD + v * imgH;
      o.x1 = X(o.x1); o.y1 = Y(o.y1);
      if (o.x2 != null) { o.x2 = X(o.x2); o.y2 = Y(o.y2); }
      o.size = o.size * imgW;
      return o;
    }
    function norm(s) {
      const o = JSON.parse(JSON.stringify(s));
      const X = v => (v - PAD) / imgW, Y = v => (v - PAD) / imgH;
      o.x1 = X(o.x1); o.y1 = Y(o.y1);
      if (o.x2 != null) { o.x2 = X(o.x2); o.y2 = Y(o.y2); }
      o.size = o.size / imgW;
      return o;
    }
    let active = null;         // in-progress shape
    let sel = -1;              // index of the selected mark
    let baseReady = false;

    // The canvas is larger than the photo: PAD is blank margin on every side
    // so notes and arrows can be placed outside the picture itself.
    let PAD = 0, imgW = 0, imgH = 0;

    function fit() {
      const maxW = Math.min(window.innerWidth - 32, 760);
      const maxH = window.innerHeight * 0.52;
      let w = img.width, h = img.height;
      const r = Math.min(maxW / w, maxH / h, 1);
      imgW = Math.round(w * r);
      imgH = Math.round(h * r);
      PAD = Math.round(Math.max(56, Math.min(imgW, imgH) * 0.22));
      canvas.width = imgW + PAD * 2;
      canvas.height = imgH + PAD * 2;
    }

    function updateHint() {
      const el = wrap.querySelector("#ehint");
      if (!el) return;
      if (sel >= 0) {
        el.innerHTML = '<b style="color:#1971C2">編集中</b> — ドラッグで移動、青い丸で大きさ、緑の丸で回転。' +
          (strokes[sel] && strokes[sel].type === "text" ? '文字は「文字を直す」で打ち直せます。' : "") +
          '何もない所をタップすると選択を解除します。';
      } else {
        el.innerHTML = '<b style="color:#2F9E44">追加できます</b> — ' +
          (tool === "text" ? "画像をタップするとその場で入力できます(Enterで確定)。"
                           : "画像をドラッグすると" + (tool === "arrow" ? "矢印" : "囲み") + "を描けます。") +
          "白い余白にも書けます。書いたものをタップすると編集できます。";
      }
    }

    function redraw() {
      if (!baseReady) return;
      updateHint();
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, PAD, PAD, imgW, imgH);
      ctx.save();
      ctx.strokeStyle = "#D8D2C0";
      ctx.lineWidth = 1;
      ctx.strokeRect(PAD + 0.5, PAD + 0.5, imgW - 1, imgH - 1);
      ctx.restore();
      const all = active ? strokes.concat([active]) : strokes;
      all.forEach((s, i) => {
        if (s.hidden) return;              // being retyped in the live box
        drawShape(s);
        if (i === sel && !active) outline(s);
      });
    }

    // Bounding box of a mark, used for selection and the highlight ring.
    // Box of a mark ignoring rotation ("local" space). Everything is stored
    // unrotated plus a rot angle, so this is the shape's own frame.
    function localBox(s) {
      if (s.type === "text") {
        const fs = Math.max(16, s.size * 4);
        const lines = String(s.text).split("\n");
        const w = Math.max(...lines.map(l => l.length)) * fs * 0.62;
        return { x1:s.x1, y1:s.y1, x2:s.x1 + w, y2:s.y1 + lines.length * fs * 1.25 };
      }
      return {
        x1:Math.min(s.x1, s.x2), y1:Math.min(s.y1, s.y2),
        x2:Math.max(s.x1, s.x2), y2:Math.max(s.y1, s.y2)
      };
    }
    function centreOf(s) {
      const b = localBox(s);
      return { x:(b.x1 + b.x2) / 2, y:(b.y1 + b.y2) / 2 };
    }
    // Convert between screen space and the mark's own rotated frame.
    function toWorld(pt, s) {
      const r = s.rot || 0;
      if (!r) return { x:pt.x, y:pt.y };
      const c0 = centreOf(s), cos = Math.cos(r), sin = Math.sin(r);
      const dx = pt.x - c0.x, dy = pt.y - c0.y;
      return { x:c0.x + dx*cos - dy*sin, y:c0.y + dx*sin + dy*cos };
    }
    function toLocal(pt, s) {
      const r = s.rot || 0;
      if (!r) return { x:pt.x, y:pt.y };
      const c0 = centreOf(s), cos = Math.cos(-r), sin = Math.sin(-r);
      const dx = pt.x - c0.x, dy = pt.y - c0.y;
      return { x:c0.x + dx*cos - dy*sin, y:c0.y + dx*sin + dy*cos };
    }
    // Kept for callers that just want the unrotated box.
    function bbox(s) { return localBox(s); }

    // The canvas is drawn at full image resolution but displayed shrunk to fit
    // the screen, so handle sizes are converted from on-screen pixels into
    // canvas pixels. Otherwise the grab targets end up far too small to hit.
    function dscale() {
      const r = canvas.getBoundingClientRect();
      return r.width ? canvas.width / r.width : 1;
    }
    function HPADv() { return 10 * dscale(); }   // gap between mark and ring
    function HRv() { return 16 * dscale(); }     // drawn radius of a handle
    function HITv() { return 30 * dscale(); }    // finger-friendly grab radius

    // Corner positions of the selection ring, used both for drawing the
    // handles and for working out whether a touch grabbed one.
    // Handle positions in screen space (corners for resizing, plus one grip
    // above the mark for rotating).
    function handles(s) {
      const b = localBox(s), g = HPADv();
      const local = [
        { id:"tl", x:b.x1 - g, y:b.y1 - g },
        { id:"tr", x:b.x2 + g, y:b.y1 - g },
        { id:"bl", x:b.x1 - g, y:b.y2 + g },
        { id:"br", x:b.x2 + g, y:b.y2 + g },
        { id:"rot", x:(b.x1 + b.x2) / 2, y:b.y1 - g - 34 * dscale() }
      ];
      return local.map(h => {
        const w = toWorld(h, s);
        return { id:h.id, x:w.x, y:w.y };
      });
    }

    function outline(s) {
      const b = localBox(s), g = HPADv(), r = HRv(), k = dscale();
      const c0 = centreOf(s);
      ctx.save();
      if (s.rot) {
        ctx.translate(c0.x, c0.y);
        ctx.rotate(s.rot);
        ctx.translate(-c0.x, -c0.y);
      }
      ctx.strokeStyle = "#1971C2";
      ctx.lineWidth = 2 * k;
      ctx.setLineDash([6 * k, 4 * k]);
      ctx.strokeRect(b.x1 - g, b.y1 - g, (b.x2 - b.x1) + g*2, (b.y2 - b.y1) + g*2);
      ctx.setLineDash([]);
      ctx.beginPath();                       // stem up to the rotate grip
      ctx.moveTo((b.x1 + b.x2) / 2, b.y1 - g);
      ctx.lineTo((b.x1 + b.x2) / 2, b.y1 - g - 34 * k);
      ctx.stroke();
      ctx.restore();

      for (const h of handles(s)) {
        const isRot = h.id === "rot";
        ctx.beginPath();
        ctx.arc(h.x, h.y, isRot ? r * 1.05 : r, 0, Math.PI * 2);
        ctx.fillStyle = isRot ? "#2F9E44" : "#1971C2";
        ctx.fill();
        ctx.beginPath();
        ctx.arc(h.x, h.y, r * 0.45, 0, Math.PI * 2);
        ctx.fillStyle = "#FFFFFF";
        ctx.fill();
      }
    }

    function hitTest(p) {
      const pad = 12 * dscale();
      for (let i = strokes.length - 1; i >= 0; i--) {
        const s = strokes[i];
        const q = toLocal(p, s);
        const b = localBox(s);
        if (q.x >= b.x1 - pad && q.x <= b.x2 + pad && q.y >= b.y1 - pad && q.y <= b.y2 + pad) return i;
      }
      return -1;
    }

    function handleAt(p) {
      if (sel < 0) return null;
      const lim = HITv();
      let best = null, bestD = Infinity;
      for (const h of handles(strokes[sel])) {
        const d = Math.hypot(p.x - h.x, p.y - h.y);
        if (d <= lim && d < bestD) { bestD = d; best = h.id; }
      }
      return best;
    }

    // Resize a mark around the corner opposite the one being dragged.
    function scaleShape(s, f, ax, ay) {
      const sc = (x, y) => ({ x: ax + (x - ax) * f, y: ay + (y - ay) * f });
      if (s.type === "text") {
        const a = sc(s.x1, s.y1);
        s.x1 = a.x; s.y1 = a.y;
        s.size = Math.max(2, s.size * f);
      } else {
        const a = sc(s.x1, s.y1), b2 = sc(s.x2, s.y2);
        s.x1 = a.x; s.y1 = a.y; s.x2 = b2.x; s.y2 = b2.y;
        s.size = Math.max(1, s.size * Math.sqrt(f));
      }
    }

    function drawShape(s) {
      ctx.save();
      if (s.rot) {                      // spin the mark about its own centre
        const b = localBox(s);
        ctx.translate((b.x1 + b.x2) / 2, (b.y1 + b.y2) / 2);
        ctx.rotate(s.rot);
        ctx.translate(-(b.x1 + b.x2) / 2, -(b.y1 + b.y2) / 2);
      }
      ctx.strokeStyle = s.color;
      ctx.fillStyle = s.color;
      ctx.lineWidth = s.size;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      if (s.type === "rect") {
        ctx.strokeRect(s.x1, s.y1, s.x2 - s.x1, s.y2 - s.y1);
      } else if (s.type === "arrow") {
        const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
        const ang = Math.atan2(dy, dx);
        const head = Math.max(12, s.size * 3.2);
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x2, s.y2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(s.x2, s.y2);
        ctx.lineTo(s.x2 - head * Math.cos(ang - Math.PI/7), s.y2 - head * Math.sin(ang - Math.PI/7));
        ctx.lineTo(s.x2 - head * Math.cos(ang + Math.PI/7), s.y2 - head * Math.sin(ang + Math.PI/7));
        ctx.closePath();
        ctx.fill();
      } else if (s.type === "text") {
        const fs = Math.max(16, s.size * 4);
        ctx.font = "bold " + fs + "px 'Hiragino Sans','Yu Gothic',sans-serif";
        ctx.textBaseline = "top";
        ctx.lineWidth = Math.max(3, fs / 7);
        ctx.strokeStyle = (s.color.toUpperCase() === "#FFFFFF") ? "#000000" : "#FFFFFF";
        const lines = String(s.text).split("\n");
        lines.forEach((ln, i) => {
          const y = s.y1 + i * fs * 1.25;
          ctx.strokeText(ln, s.x1, y);
          ctx.fillText(ln, s.x1, y);
        });
      }
      ctx.restore();
    }

    // Text is typed straight onto the picture: a transparent textarea is laid
    // over the canvas at the tap point, sized and coloured like the final mark,
    // so what you type is what you see. Committed on blur or Enter.
    let liveText = null;
    // Tapping the canvas first blurs the live textarea, which commits the text
    // and clears liveText — so by the time the tap reaches start() the guard is
    // already gone. This timestamp lets that first tap count only as "finish
    // typing" instead of also opening a new text box.
    let committedAt = 0;

    function openTextInput(canvasPt, existingIdx) {
      if (liveText) return;
      const s = existingIdx != null ? strokes[existingIdx] : null;
      const k = dscale();
      const r = canvas.getBoundingClientRect();
      const wrapRect = wrap.querySelector(".ecanvas-wrap").getBoundingClientRect();
      const fsCanvas = Math.max(16, (s ? s.size : size) * 4);
      const col = s ? s.color : stroke;

      const ta = document.createElement("textarea");
      ta.className = "elive";
      ta.value = s ? s.text : "";
      ta.rows = 1;
      // place it where the tap landed, converting canvas px back to screen px
      ta.style.left = (r.left - wrapRect.left + canvasPt.x / k) + "px";
      ta.style.top  = (r.top  - wrapRect.top  + canvasPt.y / k) + "px";
      ta.style.fontSize = (fsCanvas / k) + "px";
      ta.style.color = col;
      ta.style.textShadow = (col.toUpperCase() === "#FFFFFF")
        ? "0 0 3px #000, 0 0 3px #000" : "0 0 3px #fff, 0 0 3px #fff";
      wrap.querySelector(".ecanvas-wrap").appendChild(ta);

      if (s) { s.hidden = true; redraw(); }   // hide the original while editing
      liveText = { el:ta, pt:canvasPt, idx:existingIdx };
      setTimeout(() => { ta.focus(); ta.select(); }, 0);

      function autosize() {
        ta.style.width = "auto";
        ta.style.width = Math.max(60, ta.scrollWidth + 8) + "px";
        ta.style.height = "auto";
        ta.style.height = ta.scrollHeight + "px";
      }
      autosize();
      ta.addEventListener("input", autosize);
      ta.addEventListener("keydown", ev => {
        if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); commitText(); }
        if (ev.key === "Escape") { ev.preventDefault(); commitText(true); }
      });
      ta.addEventListener("blur", () => commitText());
    }

    function commitText(cancel) {
      if (!liveText) return;
      const { el, pt, idx } = liveText;
      const txt = el.value.replace(/\s+$/, "");
      liveText = null;
      committedAt = Date.now();
      if (el.parentNode) el.parentNode.removeChild(el);

      if (idx != null) {
        const s = strokes[idx];
        delete s.hidden;
        if (!cancel) {
          if (txt.trim()) { s.text = txt; sel = idx; }
          else { strokes.splice(idx, 1); sel = -1; }
        }
      } else if (!cancel && txt.trim()) {
        strokes.push({ type:"text", text:txt, x1:pt.x, y1:pt.y, color:stroke, size:size });
        sel = strokes.length - 1;
      }
      redraw();
    }

    function pos(e) {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return {
        x: (t.clientX - r.left) * (canvas.width / r.width),
        y: (t.clientY - r.top) * (canvas.height / r.height)
      };
    }

    let dragFrom = null;      // last pointer position while moving a mark
    let resizing = null;      // { ax, ay, d0 } while dragging a corner handle
    let rotating = null;      // { cx, cy, a0, r0 } while dragging the rotate grip
    let movedFar = false;     // distinguishes a tap from a drag
    let tapCandidate = -1;    // text mark that a still tap would reopen
    let downAt = null;

    function start(e) {
      if (!baseReady) return;
      if (liveText) { commitText(); return; }          // finish typing first
      if (Date.now() - committedAt < 400) return;      // that tap only confirmed
      e.preventDefault();
      const p = pos(e);
      downAt = p;
      movedFar = false;
      tapCandidate = -1;

      // 1. grabbing a corner handle of the selected mark => resize
      const h = handleAt(p);   // "tl".."br", "rot", or null
      if (h === "rot") {
        const s = strokes[sel];
        const c0 = centreOf(s);
        rotating = {
          cx: c0.x, cy: c0.y,
          a0: Math.atan2(p.y - c0.y, p.x - c0.x),
          r0: s.rot || 0
        };
        return;
      }
      if (h) {
        const s = strokes[sel];
        const b = localBox(s);
        const q = toLocal(p, s);                    // work in the mark's frame
        const ax = h.includes("l") ? b.x2 : b.x1;   // anchor = opposite corner
        const ay = h.includes("t") ? b.y2 : b.y1;
        const min = 12 * dscale();
        resizing = { ax:ax, ay:ay, d0: Math.max(min, Math.hypot(q.x - ax, q.y - ay)) };
        return;
      }

      // 2. touching an existing mark => select it and start moving.
      // If it is text that was already selected, a tap that never travels
      // reopens it for retyping; the decision is made in end(), so dragging
      // still just moves it.
      const hit = hitTest(p);
      if (hit >= 0) {
        tapCandidate = (strokes[hit].type === "text" && sel === hit) ? hit : -1;
        sel = hit;
        dragFrom = p;
        redraw();
        return;
      }

      // 3. empty space. While something is selected the canvas is in "edit"
      // mode: this tap only clears the selection, so a slightly-off grab never
      // turns into an unwanted new mark. Drawing resumes on the next tap, once
      // nothing is selected.
      if (sel >= 0) {
        sel = -1;
        redraw();
        return;
      }
      if (tool === "text") {
        openTextInput(p, null);
        return;
      }
      active = { type:tool, x1:p.x, y1:p.y, x2:p.x, y2:p.y, color:stroke, size:size };
      redraw();
    }

    function move(e) {
      if (!resizing && !rotating && !dragFrom && !active) return;
      e.preventDefault();
      const p = pos(e);
      if (downAt && Math.hypot(p.x - downAt.x, p.y - downAt.y) > 6 * dscale()) movedFar = true;

      if (rotating) {
        const a = Math.atan2(p.y - rotating.cy, p.x - rotating.cx);
        strokes[sel].rot = rotating.r0 + (a - rotating.a0);
        redraw();
        return;
      }
      if (resizing) {
        const min = 12 * dscale();
        const q = toLocal(p, strokes[sel]);
        const d = Math.max(min, Math.hypot(q.x - resizing.ax, q.y - resizing.ay));
        const f = d / resizing.d0;
        if (f > 0.02 && f < 50) {
          scaleShape(strokes[sel], f, resizing.ax, resizing.ay);
          resizing.d0 = d;
          redraw();
        }
        return;
      }
      if (dragFrom) {
        const dx = p.x - dragFrom.x, dy = p.y - dragFrom.y;
        const s = strokes[sel];
        s.x1 += dx; s.y1 += dy;
        if (s.x2 != null) { s.x2 += dx; s.y2 += dy; }
        dragFrom = p;
        redraw();
        return;
      }
      active.x2 = p.x; active.y2 = p.y;
      redraw();
    }

    function end() {
      const wasDragging = dragFrom != null;
      dragFrom = null;
      resizing = null;
      rotating = null;
      downAt = null;

      // A still tap on already-selected text means "let me retype this".
      if (wasDragging && !movedFar && tapCandidate >= 0) {
        const i = tapCandidate;
        tapCandidate = -1;
        openTextInput({ x:strokes[i].x1, y:strokes[i].y1 }, i);
        return;
      }
      tapCandidate = -1;

      if (!active) return;
      const a = active;
      active = null;
      const tiny = Math.abs(a.x2 - a.x1) < 5 && Math.abs(a.y2 - a.y1) < 5;
      if (!tiny) { strokes.push(a); sel = strokes.length - 1; }
      redraw();
    }

    canvas.addEventListener("mousedown", start);
    canvas.addEventListener("mousemove", move);
    window.addEventListener("mouseup", end);
    canvas.addEventListener("touchstart", start, { passive:false });
    canvas.addEventListener("touchmove", move, { passive:false });
    canvas.addEventListener("touchend", end);

    wrap.querySelectorAll(".etool").forEach(b => b.onclick = () => {
      tool = b.dataset.tool;
      redraw();
      wrap.querySelectorAll(".etool").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
    });
    wrap.querySelectorAll(".ecolor").forEach(b => b.onclick = () => {
      stroke = b.dataset.color;
      wrap.querySelectorAll(".ecolor").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      if (sel >= 0) { strokes[sel].color = stroke; redraw(); }
    });
    wrap.querySelectorAll(".esize").forEach(b => b.onclick = () => {
      size = Number(b.dataset.size);
      wrap.querySelectorAll(".esize").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      if (sel >= 0) { strokes[sel].size = size; redraw(); }
    });
    wrap.querySelector("#eundo").onclick = () => { strokes.pop(); sel = -1; redraw(); };
    wrap.querySelector("#etext").onclick = () => {
      if (sel < 0 || strokes[sel].type !== "text") {
        alert("直したい文字をタップして選んでから押してください。");
        return;
      }
      openTextInput({ x:strokes[sel].x1, y:strokes[sel].y1 }, sel);
    };

    wrap.querySelector("#edel").onclick = () => {
      if (sel < 0) { alert("消したい書き込みをタップして選んでから押してください。"); return; }
      strokes.splice(sel, 1);
      sel = -1;
      redraw();
    };
    wrap.querySelector("#eclear").onclick = () => {
      if (!strokes.length) return;
      if (confirm("書き込みをすべて消します。よろしいですか?")) { strokes = []; sel = -1; redraw(); }
    };

    function cleanup() {
      window.removeEventListener("mouseup", end);
      document.body.removeChild(wrap);
    }
    wrap.querySelector("#ecancel").onclick = () => { cleanup(); resolve(null); };
    wrap.querySelector("#edone").onclick = () => {
      commitText();
      sel = -1;
      redraw();
      const marks = strokes.map(norm);
      canvas.toBlob(b => { cleanup(); resolve({ blob: b, marks: marks }); }, "image/jpeg", 0.88);
    };

    img.onload = () => {
      baseReady = true;
      fit();
      strokes = (existing || []).map(denorm);
      redraw();
    };
    img.onerror = () => { cleanup(); resolve(null); };
    img.src = src;
  });
}

function blobToUrlSrc(fileOrBlob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(fileOrBlob);
  });
}

// A photo is stored as { base, display, marks }:
//   base    = the clean uploaded original (never changes)
//   marks   = the annotation shapes, kept as data so they stay editable
//   display = base + marks flattened, re-uploaded whenever marks change
// Older entries were plain URL strings with the marks already burned in;
// those are wrapped so they still show, but start with no editable marks.
function asPhoto(v) {
  if (!v) return null;
  if (typeof v === "string") return { base: v, display: v, marks: [] };
  return { base: v.base, display: v.display || v.base, marks: v.marks || [] };
}
function photoSrc(v) { const p = asPhoto(v); return p ? p.display : ""; }

function getPhotoEntry(target, key, idx) {
  return target === "item" ? asPhoto(photosOf(key)[idx]) : asPhoto(matPhotos[key]);
}
function putPhotoEntry(target, key, idx, entry) {
  if (target === "item") {
    const list = photosOf(key).slice();
    if (idx == null) list.push(entry); else list[idx] = entry;
    setPhotosOf(key, list);
  } else matPhotos[key] = entry;
}

async function setPhoto(target, key, useCamera) {
  const file = await pickFile(useCamera);
  if (!file) return;
  let src;
  try { src = await blobToUrlSrc(file); }
  catch (e) { status = { type:"err", msg:"画像を読めませんでした" }; render(); return; }
  const result = await annotateImage(src, []);
  if (!result) return;
  await withSave(async () => {
    const baseUrl = await uploadImage(file);
    const displayUrl = result.marks.length ? await uploadImage(result.blob) : baseUrl;
    putPhotoEntry(target, key, null, { base: baseUrl, display: displayUrl, marks: result.marks });
  }, "写真を登録しました");
}

// Re-open the editor on a photo that is already registered.
// For items, idx selects which of the item's photos to edit.
async function annotateExisting(target, key, idx) {
  const entry = getPhotoEntry(target, key, idx);
  if (!entry) return;
  const result = await annotateImage(entry.base, entry.marks);
  if (!result) return;
  await withSave(async () => {
    const displayUrl = result.marks.length ? await uploadImage(result.blob) : entry.base;
    putPhotoEntry(target, key, idx, { base: entry.base, display: displayUrl, marks: result.marks });
  }, "書き込みを保存しました");
}

async function clearPhoto(target, key, idx) {
  await withSave(async () => {
    if (target === "item") {
      const list = photosOf(key).slice();
      list.splice(idx, 1);
      setPhotosOf(key, list);
    } else delete matPhotos[key];
  }, "写真を削除しました");
}

// Full-screen photo viewer. Tapping any thumbnail opens the picture large,
// with pinch-zoom left to the browser and a tap anywhere to close.
function openLightbox(src) {
  if (!src) return;
  const bg = document.createElement("div");
  bg.className = "lightbox";
  bg.innerHTML =
    '<button class="lbclose" aria-label="閉じる">✕</button>' +
    '<img src="' + esc(src) + '" alt="" />';
  bg.onclick = () => { if (bg.parentNode) document.body.removeChild(bg); };
  document.body.appendChild(bg);
}

// ---------- modals ----------
function openModal(cfg) { modal = cfg; renderModal(); }
function closeModal() { modal = null; renderModal(); }

// Categories are not stored separately: they live on the material rows. So
// renaming one means rewriting every row that carries it, and a brand-new
// category has nothing to attach to until it gets its first item.
function categoryFormModal(existingCat) {
  const count = existingCat
    ? [...itemMap.values()].filter(i => (i.category || "その他") === existingCat).length
    : 0;
  openModal({
    title: existingCat ? "商品分類を編集" : "商品分類を追加",
    message: existingCat ? ("この分類の品目: " + count + " 件") : "",
    fields: [
      { key:"name", label:"分類名", value: existingCat || "", required:true }
    ],
    extraButton: existingCat
      ? { label:"この分類を削除", danger:true, onClick: () => deleteCategoryModal(existingCat, count) }
      : null,
    onSubmit: async vals => {
      const name = vals.name.trim();
      if (!name) throw new Error("分類名を入力してください");
      if (!existingCat) {
        if (allCats().includes(name) || pendingCats.includes(name)) {
          throw new Error("その分類はすでにあります");
        }
        pendingCats.push(name);
        activeCat = name;
        render();
        return;
      }
      if (name === existingCat) return;
      await withSave(async () => {
        for (const r of rows) if ((r.category || "その他") === existingCat) r.category = name;
        pendingCats = pendingCats.filter(x => x !== existingCat);
        activeCat = name;
      }, "分類名を変更しました");
    }
  });
}

function deleteCategoryModal(cat, count) {
  if (!count) {
    pendingCats = pendingCats.filter(x => x !== cat);
    activeCat = "全て";
    closeModal();
    render();
    return;
  }
  const others = allCats().filter(x => x !== cat);
  openModal({
    title: "分類を削除",
    message: "「" + cat + "」には品目が " + count + " 件あります。品目の移動先を選ぶか、空欄のままにすると「その他」になります。",
    fields: [
      { key:"moveTo", label:"移動先の分類", value: others[0] || "その他", list: others.concat(["その他"]) }
    ],
    danger: true,
    onSubmit: async vals => {
      const to = vals.moveTo.trim() || "その他";
      await withSave(async () => {
        for (const r of rows) if ((r.category || "その他") === cat) r.category = to;
        pendingCats = pendingCats.filter(x => x !== cat);
        activeCat = "全て";
      }, "分類を削除しました");
    }
  });
}

function itemFormModal(existingItem) {
  const cur = existingItem ? itemMap.get(existingItem) : null;
  const first = cur ? cur.materials[0] : null;
  openModal({
    title: cur ? "品目を編集" : "品目を追加",
    fields: [
      { key:"item", label:"品目名", value: cur ? cur.item : "", required:true },
      { key:"category", label:"商品分類", value: cur ? (cur.category||"") : "", list: allCats() },
      { key:"sale_type", label:"販売区分", value: first ? (first.sale_type||"通常") : "通常",
        list:["通常","レギュラー","予定数","IDF"] },
      { key:"memo", label:"メモ(任意)", value: cur ? (cur.memo||"") : "", textarea:true },
    ],
    onSubmit: async vals => {
      if (!vals.item.trim()) throw new Error("品目名を入力してください");
      await withSave(async () => {
        if (cur) {
          const oldName = cur.item;
          for (const r of rows) {
            if (r.item === oldName) {
              r.item = vals.item.trim();
              r.category = vals.category.trim();
              r.memo = vals.memo;
            }
          }
          if (oldName !== vals.item.trim() && itemPhotos[oldName]) {
            setPhotosOf(vals.item.trim(), photosOf(oldName));
            delete itemPhotos[oldName];
          }
          selected = vals.item.trim();
        } else {
          const id = newId();
          rows.push({
            id, item: vals.item.trim(), category: vals.category.trim(),
            sale_type: vals.sale_type.trim(), material_category:"未分類",
            material_name:"(資材を追加してください)", supplier:"",
            common_or_dedicated:"", memo: vals.memo
          });
          selected = vals.item.trim();
        }
      }, cur ? "品目を更新しました" : "品目を追加しました");
    }
  });
}

// Unique materials across every item, so an existing one can be reused
// instead of retyped. Photos are keyed by name, so reuse brings the photo too.
function knownMaterials() {
  const map = new Map();
  for (const r of rows) {
    const n = (r.material_name || "").trim();
    if (!n || n === "(資材を追加してください)") continue;
    if (!map.has(n)) {
      map.set(n, {
        material_name: n,
        material_category: r.material_category || "",
        supplier: r.supplier || "",
        common_or_dedicated: r.common_or_dedicated || "",
        uses: 0
      });
    }
    map.get(n).uses++;
  }
  return [...map.values()].sort((a,b) => b.uses - a.uses || a.material_name.localeCompare(b.material_name, "ja"));
}

function materialFormModal(existingRow) {
  const cur = itemMap.get(selected);
  const matCats = [...new Set(rows.map(r => r.material_category).filter(Boolean))];
  const suppliers = [...new Set(rows.map(r => r.supplier).filter(Boolean))];
  const usedHere = new Set(cur.materials.map(m => m.material_name));
  const reusable = existingRow ? [] : knownMaterials().filter(k => !usedHere.has(k.material_name));
  openModal({
    title: existingRow ? "資材を編集" : "資材を追加",
    picker: reusable,
    fields: [
      { key:"material_name", label:"資材名・型番", value: existingRow ? existingRow.material_name : "", required:true },
      { key:"material_category", label:"資材区分", value: existingRow ? existingRow.material_category : "", list: matCats },
      { key:"supplier", label:"仕入先", value: existingRow ? existingRow.supplier : "", list: suppliers },
      { key:"common_or_dedicated", label:"共通/専用", value: existingRow ? existingRow.common_or_dedicated : "共通",
        list:["共通","専用"] },
      { key:"sale_type", label:"販売区分", value: existingRow ? existingRow.sale_type : "通常",
        list:["通常","レギュラー","予定数","IDF"] },
    ],
    onSubmit: async vals => {
      if (!vals.material_name.trim()) throw new Error("資材名を入力してください");
      await withSave(async () => {
        if (existingRow) {
          Object.assign(existingRow, {
            material_name: vals.material_name.trim(),
            material_category: vals.material_category.trim() || "未分類",
            supplier: vals.supplier.trim(),
            common_or_dedicated: vals.common_or_dedicated.trim(),
            sale_type: vals.sale_type.trim()
          });
        } else {
          rows.push({
            id: newId(), item: cur.item, category: cur.category || "",
            sale_type: vals.sale_type.trim(),
            material_category: vals.material_category.trim() || "未分類",
            material_name: vals.material_name.trim(),
            supplier: vals.supplier.trim(),
            common_or_dedicated: vals.common_or_dedicated.trim(), memo:""
          });
        }
        // drop the auto placeholder row once a real material exists
        const ph = rows.filter(r => r.item === cur.item && r.material_name === "(資材を追加してください)");
        if (ph.length && rows.filter(r => r.item === cur.item).length > ph.length) {
          for (const p of ph) rows.splice(rows.indexOf(p), 1);
        }
      }, existingRow ? "資材を更新しました" : "資材を追加しました");
    }
  });
}

function confirmModal(title, msg, onYes) {
  openModal({ title, message: msg, fields: [], danger:true, onSubmit: async () => { await onYes(); } });
}

function renderModal() {
  const root = document.getElementById("modalRoot");
  if (!modal) { root.innerHTML = ""; return; }
  const c = color(itemMap.get(selected) ? itemMap.get(selected).category : "");
  let html = '<div class="modal-bg" id="mbg"><div class="modal">';
  html += "<h3>" + esc(modal.title) + "</h3>";
  if (modal.message) html += '<p style="font-size:13px;color:#5A5648;margin:0 0 12px">' + esc(modal.message) + "</p>";
  if (modal.picker && modal.picker.length) {
    html += '<div class="field"><label>登録済みの資材から選ぶ(任意)</label>';
    html += '<div class="picker" id="picker">';
    for (const k of modal.picker) {
      const ph = photoSrc(matPhotos[k.material_name]);
      const thumb = ph
        ? '<img class="pthumb" src="' + esc(ph) + '" onerror="this.style.display=\'none\'" />'
        : '<div class="pthumb empty">写真<br>なし</div>';
      html += '<button type="button" class="pitem" data-pick="' + esc(k.material_name) + '">' +
        thumb +
        '<span class="pbody"><span class="pname">' + esc(k.material_name) + '</span>' +
        '<span class="pmeta">' + esc(k.material_category || "区分なし") +
        (k.supplier ? " ・ " + esc(k.supplier) : "") +
        " ・ " + k.uses + "品目で使用</span></span></button>";
    }
    html += "</div>";
    html += '<p style="font-size:11px;color:#9A9382;margin:6px 0 0">タップすると下の欄が自動入力されます。写真も引き継がれます。</p>';
    html += "</div>";
  }
  for (const f of (modal.fields || [])) {
    html += '<div class="field"><label>' + esc(f.label) + "</label>";
    if (f.textarea) {
      html += '<textarea id="f_' + f.key + '">' + esc(f.value) + "</textarea>";
    } else if (f.list && f.list.length) {
      html += '<input id="f_' + f.key + '" value="' + esc(f.value) + '" list="dl_' + f.key + '" />';
      html += '<datalist id="dl_' + f.key + '">';
      for (const o of f.list) html += "<option>" + esc(o) + "</option>";
      html += "</datalist>";
    } else {
      html += '<input id="f_' + f.key + '" value="' + esc(f.value) + '" />';
    }
    html += "</div>";
  }
  if (modal.extraButton) {
    html += '<button class="btn" id="mextra" style="width:100%;margin-top:4px;background:#fff;' +
            'border:1px solid #D8D2C0;color:' + (modal.extraButton.danger ? "#B5552F" : "#5A5648") + '">' +
            esc(modal.extraButton.label) + "</button>";
  }
  html += '<div class="modal-actions">';
  html += '<button class="btn" id="mcancel" style="background:#fff;border:1px solid #D8D2C0;color:#5A5648">キャンセル</button>';
  html += '<button class="btn" id="mok" style="background:' + (modal.danger ? "#B5552F" : c) + '">' +
          (modal.danger ? "削除する" : "保存") + "</button>";
  html += "</div></div></div>";
  root.innerHTML = html;

  const extra = document.getElementById("mextra");
  if (extra) extra.onclick = () => modal.extraButton.onClick();

  root.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    const k = (modal.picker || []).find(x => x.material_name === b.dataset.pick);
    if (!k) return;
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
    set("f_material_name", k.material_name);
    set("f_material_category", k.material_category);
    set("f_supplier", k.supplier);
    set("f_common_or_dedicated", k.common_or_dedicated || "共通");
    root.querySelectorAll("[data-pick]").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel");
  });

  document.getElementById("mcancel").onclick = closeModal;
  document.getElementById("mbg").onclick = e => { if (e.target.id === "mbg") closeModal(); };
  document.getElementById("mok").onclick = async () => {
    const vals = {};
    for (const f of (modal.fields || [])) {
      const el = document.getElementById("f_" + f.key);
      vals[f.key] = el ? el.value : "";
    }
    const fn = modal.onSubmit;
    closeModal();
    try { await fn(vals); }
    catch (e) { status = { type:"err", msg:"エラー: " + e.message }; render(); }
  };
}

// ---------- render ----------
function filtered() {
  let pool = [...itemMap.values()];
  if (activeCat !== "全て") pool = pool.filter(i => (i.category || "その他") === activeCat);
  if (query.trim()) {
    const q = query.trim().toLowerCase();
    pool = pool.filter(i => i.item.toLowerCase().includes(q));
  }
  return pool;
}

function renderCats() {
  const el = document.getElementById("cats");
  el.innerHTML = "";
  for (const c of ["全て", ...allCats()]) {
    const b = document.createElement("button");
    b.className = "cat-btn" + (activeCat === c ? " active" : "");
    b.textContent = c;
    if (activeCat === c) b.style.background = c === "全て" ? "#3F7D4A" : color(c);
    b.onclick = () => { activeCat = c; render(); };
    el.appendChild(b);
  }
  // Editing a category is offered only while that category is the active
  // filter, so the row of chips stays readable.
  if (activeCat !== "全て") {
    const edit = document.createElement("button");
    edit.className = "cat-btn";
    edit.textContent = "✎ " + activeCat + " を編集";
    edit.style.borderColor = color(activeCat);
    edit.style.color = color(activeCat);
    edit.onclick = () => categoryFormModal(activeCat);
    el.appendChild(edit);
  }
  const add = document.createElement("button");
  add.className = "cat-btn";
  add.textContent = "＋ 分類を追加";
  add.style.borderColor = "#3F7D4A";
  add.style.color = "#3F7D4A";
  add.onclick = () => categoryFormModal(null);
  el.appendChild(add);
}

function renderList() {
  const el = document.getElementById("list");
  el.innerHTML = "";

  const add = document.createElement("button");
  add.className = "item-btn";
  add.style.color = "#3F7D4A";
  add.style.fontWeight = "600";
  add.innerHTML = '<span class="left">＋ 品目を追加</span>';
  add.onclick = () => itemFormModal(null);
  el.appendChild(add);

  const pool = filtered();
  if (!pool.length) {
    el.insertAdjacentHTML("beforeend",
      '<div style="padding:24px;text-align:center;font-size:13px;color:#9A9382">該当する品目がありません</div>');
    return;
  }
  const byCat = new Map();
  for (const i of pool) {
    const c = i.category || "その他";
    if (!byCat.has(c)) byCat.set(c, []);
    byCat.get(c).push(i);
  }
  for (const [c, list] of byCat) {
    const h = document.createElement("div");
    h.className = "cat-head";
    h.style.color = color(c);
    h.innerHTML = '<span class="dot" style="background:' + color(c) + '"></span>' + esc(c);
    el.appendChild(h);
    for (const i of list) {
      const b = document.createElement("button");
      b.className = "item-btn";
      if (selected === i.item) {
        b.style.background = "#fff"; b.style.color = "#2B2A24";
        b.style.fontWeight = "600"; b.style.borderLeftColor = color(c);
      }
      const firstPhoto = photoSrc(photosOf(i.item)[0]);
      const th = firstPhoto
        ? '<img class="thumb" src="' + esc(firstPhoto) + '" onerror="this.style.display=\'none\'" />' : "";
      b.innerHTML = '<span class="left">' + th + esc(i.item) + '</span><span class="count">' + i.materials.length + "</span>";
      b.onclick = () => {
        selected = i.item; status = null;
        if (window.innerWidth < 768) {
          document.getElementById("sidebar").classList.add("hidden");
          document.getElementById("main").classList.remove("hidden");
        }
        render();
      };
      el.appendChild(b);
    }
  }
}

function renderDetail() {
  const el = document.getElementById("main");
  const cur = itemMap.get(selected);
  if (!cur) {
    el.innerHTML = '<div class="detail"><p style="color:#9A9382;font-size:14px">左のリストから品目を選ぶか、「＋ 品目を追加」で新規登録してください。</p></div>';
    return;
  }
  const c = color(cur.category);

  const byMat = new Map();
  for (const m of cur.materials) {
    const k = m.material_category || "未分類";
    if (!byMat.has(k)) byMat.set(k, []);
    byMat.get(k).push(m);
  }

  let matHtml = "";
  for (const [k, list] of byMat) {
    let rowsHtml = "";
    for (const m of list) {
      const isCommon = m.common_or_dedicated === "共通";
      const p = photoSrc(matPhotos[m.material_name]);
      const thumb = p
        ? '<img class="matthumb" src="' + esc(p) + '" data-zoom="' + esc(p) +
          '" onerror="this.style.display=\'none\'" />'
        : '<div class="matthumb empty">写真<br>なし</div>';
      rowsHtml += '<div class="matrow">' + thumb + '<div class="matbody">' +
        '<div><span class="matname">' + esc(m.material_name) + "</span>" +
        (m.common_or_dedicated
          ? '<span class="tag" style="background:' + (isCommon ? "#E7F1E4" : "#FDECE4") +
            ';color:' + (isCommon ? "#3F7D4A" : "#B5552F") + '">' + esc(m.common_or_dedicated) + "</span>"
          : "") +
        "</div>" +
        '<div class="supplier">' + esc(m.supplier || "仕入先未登録") + "</div>" +
        '<div class="matactions">' +
          '<button class="minibtn" data-mp="' + esc(m.material_name) + '">写真を選ぶ</button>' +
          '<button class="minibtn" data-mc="' + esc(m.material_name) + '">カメラ</button>' +
          (p ? '<button class="minibtn" data-mw="' + esc(m.material_name) + '">書き込む</button>' : "") +
          (p ? '<button class="minibtn" data-mx="' + esc(m.material_name) + '">写真削除</button>' : "") +
          '<button class="minibtn" data-me="' + m.id + '">編集</button>' +
          '<button class="minibtn" data-md="' + m.id + '" style="color:#B5552F">削除</button>' +
        "</div></div></div>";
    }
    matHtml += '<div class="matgroup"><div class="gh" style="background:' + c + '1F;color:' + c + '">' +
      esc(k) + "</div>" + rowsHtml + "</div>";
  }

  const photos = photosOf(cur.item);
  let galleryHtml;
  if (photos.length) {
    galleryHtml = '<div class="gallery">';
    photos.forEach((u, i) => {
      galleryHtml += '<div class="gcard">' +
        '<div class="gimg"><img src="' + esc(photoSrc(u)) + '" alt="" data-zoom="' + esc(photoSrc(u)) +
          '" onerror="this.style.display=\'none\'" /></div>' +
        '<div class="gacts">' +
          '<button class="minibtn" data-iw="' + i + '">書き込む</button>' +
          '<button class="minibtn" data-ix="' + i + '" style="color:#B5552F">削除</button>' +
        "</div></div>";
    });
    galleryHtml += "</div>";
  } else {
    galleryHtml = '<div class="imgbox"><div class="placeholder">' +
      '<div class="circle" style="background:' + c + '22;color:' + c + '">' +
      esc(cur.item.slice(0,1)) + "</div><span>画像未登録</span></div></div>";
  }

  el.innerHTML =
    '<div class="detail">' +
      '<button class="back-btn" style="color:' + c + '" id="back">← 一覧に戻る</button>' +
      '<div class="badges">' +
        '<span class="badge" style="background:' + c + '22;color:' + c + '">' + esc(cur.category || "その他") + "</span>" +
        [...cur.saleTypes].map(s => '<span class="badge plain">' + esc(s) + "</span>").join("") +
      "</div>" +
      galleryHtml +
      (photos.length > 1 ? '<p class="meta" style="margin:-4px 0 10px">写真 ' + photos.length + " 枚</p>" : "") +
      (status ? '<div class="status ' + status.type + '">' + esc(status.msg) + "</div>" : "") +
      '<div class="btnrow">' +
        '<button class="btn" id="ipick" style="background:' + c + (busy ? ";opacity:.6;pointer-events:none" : "") + '">' +
          (busy ? "処理中..." : (photos.length ? "写真を追加" : "写真を選ぶ")) + "</button>" +
        '<button class="btn outline" id="icam" style="color:' + c + (busy ? ";opacity:.6;pointer-events:none" : "") + '">カメラ</button>' +
      "</div>" +

      '<h2 class="title">' + esc(cur.item) + "</h2>" +
      '<p class="meta">使用資材 ' + cur.materials.length + " 件 ・ 資材区分 " + byMat.size + " 種類</p>" +
      (cur.memo ? '<div class="memo">' + esc(cur.memo) + "</div>" : "") +
      '<div class="addbar">' +
        '<button class="minibtn" id="addmat" style="border-color:' + c + ';color:' + c + '">＋ 資材を追加</button>' +
        '<button class="minibtn" id="edititem">品目を編集</button>' +
        '<button class="minibtn" id="delitem" style="color:#B5552F">品目を削除</button>' +
      "</div>" +
      matHtml +
    "</div>";

  const back = document.getElementById("back");
  if (back) back.onclick = () => {
    document.getElementById("sidebar").classList.remove("hidden");
    document.getElementById("main").classList.add("hidden");
  };
  document.getElementById("ipick").onclick = () => setPhoto("item", cur.item, false);
  document.getElementById("icam").onclick = () => setPhoto("item", cur.item, true);
  el.querySelectorAll("[data-zoom]").forEach(img =>
    img.onclick = () => openLightbox(img.dataset.zoom));

  el.querySelectorAll("[data-iw]").forEach(b =>
    b.onclick = () => annotateExisting("item", cur.item, Number(b.dataset.iw)));
  el.querySelectorAll("[data-ix]").forEach(b =>
    b.onclick = () => clearPhoto("item", cur.item, Number(b.dataset.ix)));

  document.getElementById("addmat").onclick = () => materialFormModal(null);
  document.getElementById("edititem").onclick = () => itemFormModal(cur.item);
  document.getElementById("delitem").onclick = () => confirmModal(
    "品目を削除", "「" + cur.item + "」と、その資材" + cur.materials.length + "件をすべて削除します。よろしいですか?",
    async () => {
      await withSave(async () => {
        rows = rows.filter(r => r.item !== cur.item);
        delete itemPhotos[cur.item];
        selected = null;
      }, "品目を削除しました");
    });

  el.querySelectorAll("[data-mp]").forEach(b => b.onclick = () => setPhoto("mat", b.dataset.mp, false));
  el.querySelectorAll("[data-mc]").forEach(b => b.onclick = () => setPhoto("mat", b.dataset.mc, true));
  el.querySelectorAll("[data-mw]").forEach(b => b.onclick = () => annotateExisting("mat", b.dataset.mw));
  el.querySelectorAll("[data-mx]").forEach(b => b.onclick = () => clearPhoto("mat", b.dataset.mx));
  el.querySelectorAll("[data-me]").forEach(b => b.onclick = () => {
    const r = rows.find(x => x.id === b.dataset.me);
    if (r) materialFormModal(r);
  });
  el.querySelectorAll("[data-md]").forEach(b => b.onclick = () => {
    const r = rows.find(x => x.id === b.dataset.md);
    if (!r) return;
    confirmModal("資材を削除", "「" + r.material_name + "」を削除します。よろしいですか?", async () => {
      await withSave(async () => {
        rows = rows.filter(x => x.id !== r.id);
      }, "資材を削除しました");
    });
  });
}

function render() { renderCats(); renderList(); renderDetail(); renderModal(); }

document.getElementById("search").addEventListener("input", e => { query = e.target.value; renderList(); });

document.getElementById("showbin").addEventListener("click", () => {
  const out = document.getElementById("binout");
  out.textContent = BIN_ID;
});

rows = SEED.slice();
refreshItems();
render();
loadAll();
</script>
</body>
</html>
