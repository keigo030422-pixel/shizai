    b.onclick = () => annotateExisting("item", cur.item, Number(b.dataset.iw)));
  el.querySelectorAll("[data-ix]").forEach(b =>
    b.onclick = () => clearPhoto("item", cur.item, Number(b.dataset.ix)));

  document.getElementById("addmat").onclick = () => materialFormModal(null);
  el.querySelectorAll("[data-addcat]").forEach(b =>
    b.onclick = () => materialFormModal(null, b.dataset.addcat));
  document.getElementById("edititem").onclick = () => itemFormModal(cur.item);
  document.getElementById("dupitem").onclick = () => duplicateItemModal(cur.item);
  document.getElementById("hideitem").onclick = () => {
    const to = !cur.hidden;
    withSave(async () => { setHidden(cur.item, to); },
      to ? "非表示にしました" : "再表示しました");
  };
  document.getElementById("delitem").onclick = () => confirmModal(
    "品目を削除",
    "「" + cur.item + "」を削除します。使っていた資材 " + cur.materials.length + " 件は資材マスタに残ります。",
    async () => {
      await withSave(async () => {
        const wasUsing = cur.materials.map(m => ({
          material_name: m.material_name,
          material_category: m.material_category,
          supplier: m.supplier,
          common_or_dedicated: m.common_or_dedicated
        }));
        rows = rows.filter(r => r.item !== cur.item);
        // Preserve any material this was the last user of.
        for (const w of wasUsing) {
          if (!w.material_name || w.material_name === "(資材を追加してください)") continue;
          if (rows.some(x => x.material_name === w.material_name)) continue;
          rows.push({
            id: newId(), item: "", category: "", sale_type: "",
            material_category: w.material_category || "未分類",
            material_name: w.material_name, supplier: w.supplier || "",
            common_or_dedicated: w.common_or_dedicated || "", memo: ""
          });
        }
        delete itemPhotos[cur.item];
        selected = null;
      }, "品目を削除しました");
    });

  el.querySelectorAll("[data-mp]").forEach(b => b.onclick = () => setPhoto("mat", b.dataset.mp, false));
  el.querySelectorAll("[data-mc]").forEach(b => b.onclick = () => setPhoto("mat", b.dataset.mc, true));
  el.querySelectorAll("[data-mw]").forEach(b => b.onclick = () => annotateExisting("mat", b.dataset.mw));
  el.querySelectorAll("[data-mx]").forEach(b => b.onclick = () => clearPhoto("mat", b.dataset.mx));
  el.querySelectorAll("[data-me]").forEach(b => b.onclick = () => {
    const r = rows.find(x => x.id === b.dataset.me);
    if (r) materialFormModal(r);
  });
  el.querySelectorAll("[data-md]").forEach(b => b.onclick = () => {
    const r = rows.find(x => x.id === b.dataset.md);
    if (!r) return;
    confirmModal("この品目から外す",
      "「" + r.material_name + "」をこの品目から外します。資材そのものは資材マスタに残ります。",
      async () => {
        await withSave(async () => {
          const name = r.material_name;
          rows = rows.filter(x => x.id !== r.id);
          // If that was the last item using it, keep the material alive as a
          // holder row so it stays in the master and in the picker.
          const stillUsed = rows.some(x => x.material_name === name);
          if (!stillUsed && name && name !== "(資材を追加してください)") {
            rows.push({
              id: newId(), item: "", category: "", sale_type: "",
              material_category: r.material_category || "未分類",
              material_name: name, supplier: r.supplier || "",
              common_or_dedicated: r.common_or_dedicated || "", memo: ""
            });
          }
        }, "この品目から外しました");
      });
  });
}

function render() {
  const isMats = view === "materials";
  document.getElementById("cats").style.display = isMats ? "none" : "";
  document.getElementById("tabitems").className = "vtab" + (isMats ? "" : " active");
  document.getElementById("tabmats").className = "vtab" + (isMats ? " active" : "");
  document.getElementById("search").placeholder = isMats ? "資材名で検索..." : "品目名で検索...";
  if (isMats) { renderMatList(); renderMatDetail(); }
  else { renderCats(); renderList(); renderDetail(); }
  renderModal();
}

function switchView(v) {
  if (view === v) return;
  view = v;
  query = "";
  status = null;
  arrangeCat = null;
  arrangeMatCat = null;
  listScroll = 0;   // different list entirely, so start at the top
  cameFromMat = null;
  const s = document.getElementById("search");
  if (s) s.value = "";
  // back to the list pane on phones, since the detail may not apply any more
  if (window.innerWidth < 768) {
    document.getElementById("sidebar").classList.remove("hidden");
    document.getElementById("main").classList.add("hidden");
  }
  render();
}

document.getElementById("tabitems").addEventListener("click", () => switchView("items"));
document.getElementById("tabmats").addEventListener("click", () => switchView("materials"));

document.getElementById("search").addEventListener("input", e => {
  query = e.target.value;
  if (view === "materials") renderMatList(); else renderList();
});

document.getElementById("showbin").addEventListener("click", () => {
  const out = document.getElementById("binout");
  out.textContent = BIN_ID;
});

rows = SEED.slice();
refreshItems();
render();
loadAll();
</script>
</body>
</html>
