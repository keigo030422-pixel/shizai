<html lang="ja">
<head>
<meta charset="UTF-8" />

<title>品目別 資材ビューア</title>
<style>

  body {

  #app { display: flex; flex-direction: column; min-height: 100vh; }

    border: 1px solid #D8D2C0; font-size: 14px;
  }
  .cats { padding: 8px 12px; background: #EAE6D9; border-bottom: 1px solid #D8D2C0;

  .cat-btn {

    border: 1px solid #D8D2C0; background: #fff; color: #5A5648; cursor: pointer;

  .cat-btn.active { color: #fff; border-color: transparent; }
  .list { flex: 1; overflow-y: auto; background: #EAE6D9; }
  .cat-head {
    padding: 6px 16px; font-size: 11px; font-weight: bold;
    display: flex; align-items: center; gap: 6px; background: #EAE6D9;
    position: sticky; top: 0;
  }
  .dot { width: 7px; height: 7px; border-radius: 999px; display: inline-block; }
  .item-btn {
    width: 100%; text-align: left; padding: 11px 16px; font-size: 14px;
    background: none; border: none; border-left: 3px solid transparent;
    display: flex; justify-content: space-between; align-items: center;
    color: #5A5648; cursor: pointer;
  }
  .item-btn .thumb { width: 22px; height: 22px; border-radius: 4px; object-fit: cover; margin-right: 8px; }
  .item-btn .left { display: flex; align-items: center; }
  .item-btn .count { font-size: 11px; opacity: .5; }
  .detail { padding: 16px; max-width: 820px; margin: 0 auto; width: 100%; }
  .back-btn {
    background: none; border: none; font-size: 14px; font-weight: 600;
    padding: 4px 0 12px; cursor: pointer;
  }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .badge { font-size: 11px; padding: 4px 10px; border-radius: 999px; }
  .badge.plain { background: #fff; border: 1px solid #D8D2C0; color: #5A5648; }
  .imgbox {
    width: 100%; max-width: 260px; aspect-ratio: 1;
    background: #fff; border: 1px solid #D8D2C0; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; margin-bottom: 10px;
  }
  .imgbox img { width: 100%; height: 100%; object-fit: cover; }
  .placeholder { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .placeholder .circle {
    width: 60px; height: 60px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: bold;
  }
  .placeholder span { font-size: 11px; color: #9A9382; }
  .btn {
    display: block; width: 100%; max-width: 260px; padding: 11px;
    border-radius: 8px; border: none; font-size: 14px; font-weight: 600;
    color: #fff; cursor: pointer; margin-bottom: 8px; text-align: center;
  }
  .btn.ghost { background: #fff; border: 1px solid #D8D2C0; color: #9A5A4A; }
  h2.title { font-size: 24px; margin: 12px 0 4px; }
  p.meta { font-size: 13px; color: #8A8371; margin: 0 0 12px; }
  .memo {
    font-size: 12px; padding: 10px 12px; border-radius: 8px; white-space: pre-line;
    background: #FBF6E3; border: 1px solid #EAD9A0; color: #7A6420; margin-bottom: 16px;
  }
  .matgroup { background: #fff; border: 1px solid #E3DFD1; border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
  .matgroup .gh { padding: 9px 14px; font-size: 13px; font-weight: bold; }
  .matrow { padding: 11px 14px; border-top: 1px solid #F0EDE2; }
  .matgroup .matrow:first-of-type { border-top: none; }
  .matname { font-size: 14px; font-weight: 500; }
  .tag { font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
  .supplier { font-size: 12px; color: #9A9382; margin-top: 3px; }
  .status { font-size: 12px; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; max-width: 260px; }
  .status.err { background: #FDECE4; color: #B5552F; }
  .status.ok { background: #E7F1E4; color: #3F7D4A; }
  .hidden { display: none !important; }
  @media (min-width: 768px) {
    #app { flex-direction: row; height: 100vh; }
    .sidebar { width: 320px; flex-shrink: 0; border-right: 1px solid #D8D2C0;
               display: flex; flex-direction: column; }
    .main { flex: 1; overflow-y: auto; }
    .back-btn { display: none; }
    .sidebar, .main { display: flex !important; }
    .detail { padding: 28px; }
  }
</style>
</head>

<div id="app">

    </div>
    <div class="cats" id="cats"></div>
    <div class="list" id="list"></div>
  </div>
  <div class="main hidden" id="main"></div>
</div>

const IMGBB_KEY = "c650c72c1e1d8d48196df9f894c44187";
const JSONBIN_KEY = "$2a$10$.TU5hEqu5Rp77MXFTO.uLePLeVtkYQCR7XQTll37kXIGFVs50KZZ6";
// Bin ID is created automatically on first use and remembered in this file's
// localStorage; the shared copy below is filled in once you paste it back.
let BIN_ID = "";

const CATEGORY_COLORS = {
  "南瓜":"#C96A2E","人参":"#D97A1F","大根":"#6B8E6B","長芋":"#A8895A",
  "れんこん":"#B8935F","キャベツ":"#5B8C4A","白菜":"#7FA05C","ほうれん草":"#3F7D4A",
  "ブロッコリー":"#3E7053","トマト":"#C4432E","ぶどう":"#6B4E8E","さつまいも":"#9B5B3F",
  "きゅうり":"#4C8C3C","香味・つまもの":"#5E8C5A","その他":"#7A7568"
};
const color = c => CATEGORY_COLORS[c] || "#6B6558";

// ---- build item index ----
const itemMap = new Map();
for (const r of DATA) {
  if (!r.item) continue;
  if (!itemMap.has(r.item)) {
    itemMap.set(r.item, { item: r.item, category: r.category, saleTypes: new Set(), materials: [], memo: null });
  }
  const e = itemMap.get(r.item);
  if (r.category && !e.category) e.category = r.category;
  if (r.sale_type) e.saleTypes.add(r.sale_type);
  if (r.memo) e.memo = r.memo;
  e.materials.push(r);
}
const ITEMS = [...itemMap.values()];
const CATS = [...new Set(ITEMS.map(i => i.category || "その他"))];

let images = {};
let selected = ITEMS[0] ? ITEMS[0].item : null;
let activeCat = "全て";
let query = "";
let busy = false;
let status = null;

// ---- storage ----
function localBin() { try { return localStorage.getItem("pmv_bin_id") || ""; } catch(e) { return ""; } }
function saveLocalBin(id) { try { localStorage.setItem("pmv_bin_id", id); } catch(e) {} }

async function ensureBin() {
  if (BIN_ID) return BIN_ID;
  const cached = localBin();
  if (cached) { BIN_ID = cached; return BIN_ID; }
  const res = await fetch("https://api.jsonbin.io/v3/b", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_KEY, "X-Bin-Name": "pmv-images" },
    body: JSON.stringify({ images: {} })
  });
  const d = await res.json();
  if (!res.ok) throw new Error(d.message || "Bin作成に失敗");
  BIN_ID = d.metadata.id;
  saveLocalBin(BIN_ID);
  return BIN_ID;
}

async function loadImages() {
  try {
    const id = BIN_ID || localBin();
    if (!id) return;
    BIN_ID = id;
    const res = await fetch(`https://api.jsonbin.io/v3/b/${id}/latest`, {
      headers: { "X-Master-Key": JSONBIN_KEY }
    });
    const d = await res.json();
    if (res.ok && d.record && d.record.images) { images = d.record.images; render(); }
  } catch (e) { console.error(e); }
}

async function saveImages() {
  const id = await ensureBin();
  const res = await fetch(`https://api.jsonbin.io/v3/b/${id}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_KEY },
    body: JSON.stringify({ images })
  });
  if (!res.ok) { const d = await res.json(); throw new Error(d.message || "保存に失敗"); }
}

async function uploadToImgbb(file) {
  const b64 = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
  const fd = new FormData();
  fd.append("image", b64);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method: "POST", body: fd });
  const d = await res.json();
  if (!d.success) throw new Error("画像アップロードに失敗");
  return d.data.url;
}

async function handleFile(file) {
  if (!file || !file.type.startsWith("image/")) return;
  busy = true; status = null; render();
  try {
    const url = await uploadToImgbb(file);
    images[selected] = url;
    await saveImages();
    status = { type: "ok", msg: "登録しました" };
  } catch (e) {
    console.error(e);
    status = { type: "err", msg: "エラー: " + e.message };
  } finally { busy = false; render(); }
}

async function removeImage() {
  busy = true; status = null; render();
  try {
    delete images[selected];
    await saveImages();
    status = { type: "ok", msg: "削除しました" };
  } catch (e) {
    status = { type: "err", msg: "エラー: " + e.message };
  } finally { busy = false; render(); }
}

// ---- render ----
function filtered() {
  let pool = ITEMS;
  if (activeCat !== "全て") pool = pool.filter(i => (i.category || "その他") === activeCat);
  if (query.trim()) pool = pool.filter(i => i.item.toLowerCase().includes(query.trim().toLowerCase()));
  return pool;
}

function renderCats() {
  const el = document.getElementById("cats");
  el.innerHTML = "";
  const all = ["全て", ...CATS];
  for (const c of all) {
    const b = document.createElement("button");
    b.className = "cat-btn" + (activeCat === c ? " active" : "");
    b.textContent = c;
    if (activeCat === c) b.style.background = c === "全て" ? "#3F7D4A" : color(c);
    b.onclick = () => { activeCat = c; render(); };
    el.appendChild(b);
  }
}

function renderList() {
  const el = document.getElementById("list");
  el.innerHTML = "";
  const pool = filtered();
  const byCat = new Map();
  for (const i of pool) {
    const c = i.category || "その他";
    if (!byCat.has(c)) byCat.set(c, []);
    byCat.get(c).push(i);
  }
  if (!pool.length) {
    el.innerHTML = '<div style="padding:24px;text-align:center;font-size:13px;color:#9A9382">該当する品目がありません</div>';
    return;
  }
  for (const [c, list] of byCat) {
    const h = document.createElement("div");
    h.className = "cat-head";
    h.style.color = color(c);
    h.innerHTML = `<span class="dot" style="background:${color(c)}"></span>${c}`;
    el.appendChild(h);
    for (const i of list) {
      const b = document.createElement("button");
      b.className = "item-btn";
      if (selected === i.item) {
        b.style.background = "#fff";
        b.style.color = "#2B2A24";
        b.style.fontWeight = "600";
        b.style.borderLeftColor = color(c);
      }
      const thumb = images[i.item]
        ? `<img class="thumb" src="${images[i.item]}" onerror="this.style.display='none'" />` : "";
      b.innerHTML = `<span class="left">${thumb}${i.item}</span><span class="count">${i.materials.length}</span>`;
      b.onclick = () => {
        selected = i.item; status = null;
        if (window.innerWidth < 768) {
          document.getElementById("sidebar").classList.add("hidden");
          document.getElementById("main").classList.remove("hidden");
        }
        render();
      };
      el.appendChild(b);
    }
  }
}

function renderDetail() {
  const el = document.getElementById("main");
  const cur = itemMap.get(selected);
  if (!cur) { el.innerHTML = ""; return; }
  const c = color(cur.category);

  const byMat = new Map();
  for (const m of cur.materials) {
    const k = m.material_category || "その他";
    if (!byMat.has(k)) byMat.set(k, []);
    byMat.get(k).push(m);
  }

  let matHtml = "";
  for (const [k, list] of byMat) {
    let rows = "";
    for (const m of list) {
      const isCommon = m.common_or_dedicated === "共通";
      rows += `<div class="matrow">
        <div><span class="matname">${m.material_name || ""}</span>
        <span class="tag" style="background:${isCommon ? "#E7F1E4" : "#FDECE4"};color:${isCommon ? "#3F7D4A" : "#B5552F"}">${m.common_or_dedicated || "-"}</span></div>
        <div class="supplier">${m.supplier || "仕入先未登録"}</div>
      </div>`;
    }
    matHtml += `<div class="matgroup">
      <div class="gh" style="background:${c}1F;color:${c}">${k}</div>${rows}</div>`;
  }

  const imgHtml = images[cur.item]
    ? `<img src="${images[cur.item]}" alt="${cur.item}" />`
    : `<div class="placeholder"><div class="circle" style="background:${c}22;color:${c}">${cur.item.slice(0,1)}</div><span>画像未登録</span></div>`;

  const statusHtml = status
    ? `<div class="status ${status.type}">${status.msg}</div>` : "";

  el.innerHTML = `
    <div class="detail">
      <button class="back-btn" style="color:${c}" id="back">← 一覧に戻る</button>
      <div class="badges">
        <span class="badge" style="background:${c}22;color:${c}">${cur.category || "その他"}</span>
        ${[...cur.saleTypes].map(s => `<span class="badge plain">${s}</span>`).join("")}
      </div>
      <div class="imgbox">${imgHtml}</div>
      ${statusHtml}
      <label class="btn" style="background:${c};${busy ? "opacity:.6;pointer-events:none" : ""}">
        ${busy ? "処理中..." : (images[cur.item] ? "写真を変更" : "写真を追加")}
        <input type="file" accept="image/*" id="file" style="display:none" />
      </label>
      ${images[cur.item] ? `<button class="btn ghost" id="del">写真を削除</button>` : ""}
      <h2 class="title">${cur.item}</h2>
      <p class="meta">使用資材 ${cur.materials.length} 件 ・ 資材区分 ${byMat.size} 種類</p>
      ${cur.memo ? `<div class="memo">${cur.memo}</div>` : ""}
      ${matHtml}
    </div>`;

  const back = document.getElementById("back");
  if (back) back.onclick = () => {
    document.getElementById("sidebar").classList.remove("hidden");
    document.getElementById("main").classList.add("hidden");
  };
  const f = document.getElementById("file");
  if (f) f.onchange = e => handleFile(e.target.files[0]);
  const d = document.getElementById("del");
  if (d) d.onclick = removeImage;
}

function render() { renderCats(); renderList(); renderDetail(); }

document.getElementById("search").addEventListener("input", e => { query = e.target.value; renderList(); });

render();
loadImages();
</script>
