  "れんこん":"#B8935F","キャベツ":"#5B8C4A","白菜":"#7FA05C","ほうれん草":"#3F7D4A",
  "ブロッコリー":"#3E7053","トマト":"#C4432E","ぶどう":"#6B4E8E","さつまいも":"#9B5B3F",
  "きゅうり":"#4C8C3C","香味・つまもの":"#5E8C5A","その他":"#7A7568"
};
const PALETTE = ["#C96A2E","#5B8C4A","#6B4E8E","#C4432E","#3F7D4A","#A8895A","#4C8C3C","#7A7568"];
function color(c) {
  if (CATEGORY_COLORS[c]) return CATEGORY_COLORS[c];
  if (!c) return "#6B6558";
  let h = 0;
  for (let i = 0; i < c.length; i++) h = (h * 31 + c.charCodeAt(i)) % 9973;
  return PALETTE[h % PALETTE.length];
}
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

// ---------- state ----------
let rows = [];            // material rows (editable)
let itemPhotos = {};      // item name -> array of image urls (multiple photos per item)

// Older saved data stored a single URL string per item. Normalise both shapes
// to an array so the rest of the code only ever deals with lists.
function photosOf(item) {
  const v = itemPhotos[item];
  if (!v) return [];
  return Array.isArray(v) ? v : [v];
}
function setPhotosOf(item, list) {
  if (!list || !list.length) delete itemPhotos[item];
  else itemPhotos[item] = list;
}
function migratePhotos() {
  for (const k of Object.keys(itemPhotos)) {
    if (!Array.isArray(itemPhotos[k])) itemPhotos[k] = [itemPhotos[k]];
  }
}
let matPhotos = {};       // material NAME -> image url (shared across all items using it)
let selected = null;
let activeCat = "全て";
let query = "";
let busy = false;
let status = null;
let modal = null;
let pendingCats = [];   // categories created but with no items yet
let view = "items";     // "items" | "materials"
let showHidden = false; // reveal items marked hidden
let arrangeCat = null;  // item category currently being reordered
let arrangeMatCat = null; // material category currently being reordered
let listScroll = 0;     // remembered scroll position of the list pane
let cameFromMat = null; // material we jumped from, to offer a way back

function rememberScroll() {
  const el = document.getElementById("list");
  if (el) listScroll = el.scrollTop;
}
// Restoring has to wait for the list to be rendered and laid out again,
// otherwise there is nothing to scroll yet.
function restoreScroll() {
  const el = document.getElementById("list");
  if (!el) return;
  requestAnimationFrame(() => { el.scrollTop = listScroll; });
}
let picking = false;    // multi-select mode for showing/hiding in bulk
let picked = new Set(); // item names ticked while picking
let selectedMat = null; // material name shown in the master view

function newId() { return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// ---------- derived ----------
function buildItems() {
  const map = new Map();
  for (const r of rows) {
    if (!r.item) continue;
    if (!map.has(r.item)) {
      map.set(r.item, {
        item:r.item, category:r.category, saleTypes:new Set(), materials:[], memo:"",
        order: (typeof r.order === "number") ? r.order : null,
        hidden: !!r.hidden
      });
    }
    const e = map.get(r.item);
    if (r.category && !e.category) e.category = r.category;
    if (r.sale_type) e.saleTypes.add(r.sale_type);
    if (r.memo && !e.memo) e.memo = r.memo;
    if (typeof r.order === "number" && e.order == null) e.order = r.order;
    if (r.hidden) e.hidden = true;
    e.materials.push(r);
  }
  return map;
}

// Sort within a category: explicit order first, then anything not yet
// positioned, keeping its original data order.
function sortInCat(list) {
  return list.slice().sort((a, b) => {
    const ao = a.order == null ? Infinity : a.order;
    const bo = b.order == null ? Infinity : b.order;
    if (ao !== bo) return ao - bo;
    return 0;
  });
}

// Write positions back onto every row of each item in a category.
function applyOrder(catName, orderedNames) {
  orderedNames.forEach((name, idx) => {
    for (const r of rows) if (r.item === name) r.order = idx;
  });
}

function setHidden(itemName, val) {
  for (const r of rows) if (r.item === itemName) r.hidden = val;
}
let itemMap = new Map();
function refreshItems() {
  itemMap = buildItems();
  if (!itemMap.has(selected)) selected = itemMap.keys().next().value || null;
}
function allCats() {
  const used = [...itemMap.values()].map(i => i.category || "その他");
  return [...new Set(used.concat(pendingCats))];
}

// ---------- storage ----------
// One fixed bin for the whole team. There is deliberately no per-device
// fallback: if a phone were allowed to invent its own bin, that person would
// silently get a private copy and nobody would see their photos.
async function ensureBin() { return BIN_ID; }

async function loadAll() {
  try {
    const id = BIN_ID;
    const res = await fetch("https://api.jsonbin.io/v3/b/" + id + "/latest", {
      headers:{ "X-Master-Key":JSONBIN_KEY }
    });
    const d = await res.json();
    if (res.ok && d.record) {
      rows = Array.isArray(d.record.rows) && d.record.rows.length ? d.record.rows : SEED.slice();
      itemPhotos = d.record.itemPhotos || {};
      migratePhotos();
      matPhotos = d.record.matPhotos || {};
    } else {
      rows = SEED.slice();
    }
  } catch (e) {
    console.error(e);
    rows = SEED.slice();
  }
  refreshItems();
  render();
}

async function saveAll() {
  const id = await ensureBin();
  const res = await fetch("https://api.jsonbin.io/v3/b/" + id, {
    method:"PUT",
    headers:{ "Content-Type":"application/json", "X-Master-Key":JSONBIN_KEY },
    body: JSON.stringify({ rows, itemPhotos, matPhotos })
  });
  if (!res.ok) {
    let msg = "保存に失敗";
    try { const d = await res.json(); msg = d.message || msg; } catch(e){}
    throw new Error(msg);
  }
}

async function withSave(fn, okMsg) {
  // Rebuilding the list throws away its scroll position, which is jarring
  // mid-drag when every drop triggers a save. Hold the position across the
  // whole operation and put it back once the final render is done.
  const keep = (() => { const el = document.getElementById("list"); return el ? el.scrollTop : 0; })();
  const putBack = () => {
    const el = document.getElementById("list");
    if (el) el.scrollTop = keep;
  };

  busy = true; status = null; render(); putBack();
  try {
    await fn();
    await saveAll();
    status = { type:"ok", msg: okMsg || "保存しました" };
  } catch (e) {
    console.error(e);
    status = { type:"err", msg: "エラー: " + e.message };
  } finally {
    busy = false; refreshItems(); render();
    putBack();
    requestAnimationFrame(putBack);
    listScroll = keep;
  }
}

// ---------- image upload ----------
function shrink(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error("読み込み失敗"));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("画像を読めません"));
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL("image/jpeg", quality).split(",")[1]);
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

async function uploadImage(file) {
  const b64 = await shrink(file, 1200, 0.82);
  const fd = new FormData();
  fd.append("image", b64);
  const res = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_KEY, { method:"POST", body:fd });
  const d = await res.json();
  if (!d || !d.success) throw new Error("画像アップロードに失敗");
  return d.data.url;
}

// Opens a file input. useCamera=true asks the OS for the camera directly.
function pickFile(useCamera) {
  return new Promise(resolve => {
    const inp = document.createElement("input");
    inp.type = "file";
    inp.accept = "image/*";
    if (useCamera) inp.setAttribute("capture", "environment");
    inp.style.display = "none";
    document.body.appendChild(inp);
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      document.body.removeChild(inp);
      resolve(f || null);
    };
    inp.click();
  });
}

// ---------- photo annotation editor ----------
// Opens after a photo is picked (or from "書き込む" on an existing photo).
// `existing` are marks from a previous session, so they can be edited or
// removed rather than being permanently burned into the image.
// Resolves to { blob, marks } or null if cancelled.
function annotateImage(src, existing) {
  return new Promise(resolve => {
    const wrap = document.createElement("div");
    wrap.className = "editor-bg";
    wrap.innerHTML =
      '<div class="editor">' +
        '<div class="etoolbar">' +
          '<button class="etool active" data-tool="arrow">矢印</button>' +
          '<button class="etool" data-tool="rect">囲み</button>' +
          '<button class="etool" data-tool="text">文字</button>' +
        '</div>' +
        '<div class="etoolbar">' +
          '<span class="ecolors">' +
            '<button class="ecolor active" data-color="#E03131" style="background:#E03131"></button>' +
            '<button class="ecolor" data-color="#1971C2" style="background:#1971C2"></button>' +
            '<button class="ecolor" data-color="#2F9E44" style="background:#2F9E44"></button>' +
            '<button class="ecolor" data-color="#F08C00" style="background:#F08C00"></button>' +
            '<button class="ecolor" data-color="#FFFFFF" style="background:#FFFFFF"></button>' +
            '<button class="ecolor" data-color="#000000" style="background:#000000"></button>' +
          '</span>' +
          '<span class="esizes">' +
            '<button class="esize" data-size="3">細</button>' +
            '<button class="esize active" data-size="6">中</button>' +
            '<button class="esize" data-size="11">太</button>' +
          '</span>' +
          '<button class="ebtn" id="eundo">戻す</button>' +
          '<button class="ebtn" id="edel" style="color:#B5552F">選択を削除</button>' +
          '<button class="ebtn" id="eclear" style="color:#B5552F">全消し</button>' +
        '</div>' +
        '<div class="ecanvas-wrap"><canvas id="ecanvas"></canvas></div>' +
        '<p class="ehint" id="ehint"></p>' +
        '<div class="eactions">' +
          '<button class="btn" id="ecancel" style="background:#fff;border:1px solid #D8D2C0;color:#5A5648">キャンセル</button>' +
          '<button class="btn" id="edone" style="background:#3F7D4A">この内容で登録</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap);

    const canvas = wrap.querySelector("#ecanvas");
    const ctx = canvas.getContext("2d");
    const img = new Image();
    img.crossOrigin = "anonymous";

    let tool = "arrow", stroke = "#E03131", size = 6;
    let strokes = [];  // filled in once the image size is known (see img.onload)

    // Marks are saved relative to the photo (0..1 across its width/height, and
    // values outside that range sit in the margin), so they land in the right
    // spot no matter what size the canvas is next time it opens.
    function denorm(s) {
      const o = JSON.parse(JSON.stringify(s));
      const X = v => PAD + v * imgW, Y = v => PAD + v * imgH;
      o.x1 = X(o.x1); o.y1 = Y(o.y1);
      if (o.x2 != null) { o.x2 = X(o.x2); o.y2 = Y(o.y2); }
      o.size = o.size * imgW;
      return o;
    }
    function norm(s) {
      const o = JSON.parse(JSON.stringify(s));
      const X = v => (v - PAD) / imgW, Y = v => (v - PAD) / imgH;
      o.x1 = X(o.x1); o.y1 = Y(o.y1);
      if (o.x2 != null) { o.x2 = X(o.x2); o.y2 = Y(o.y2); }
      o.size = o.size / imgW;
      return o;
    }
    let active = null;         // in-progress shape
    let sel = -1;              // index of the selected mark
    let baseReady = false;

    // The canvas is larger than the photo: PAD is blank margin on every side
    // so notes and arrows can be placed outside the picture itself.
    let PAD = 0, imgW = 0, imgH = 0;

    function fit() {
      // Measure what the toolbars and buttons actually take, then hand the
      // rest of the screen to the picture rather than guessing a fraction.
      const stage = wrap.querySelector(".ecanvas-wrap");
      const ed = wrap.querySelector(".editor");
      const used = ed.scrollHeight - stage.clientHeight;
      const maxW = Math.min(window.innerWidth - 24, 1100);
      const maxH = Math.max(220, window.innerHeight * 0.94 - used - 16);
      let w = img.width, h = img.height;
      const r = Math.min(maxW / w, maxH / h, 2);
      imgW = Math.round(w * r);
      imgH = Math.round(h * r);
      PAD = 0;   // no margin: notes now live in the caption field instead
      canvas.width = imgW + PAD * 2;
      canvas.height = imgH + PAD * 2;
    }

    function updateHint() {
      const el = wrap.querySelector("#ehint");
      if (!el) return;
      if (sel >= 0) {
        el.innerHTML = '<b style="color:#1971C2">編集中</b> — ドラッグで移動、青い丸で大きさ、緑の丸で回転。' +
          (strokes[sel] && strokes[sel].type === "text" ? '文字はもう一度タップで打ち直せます。' : "") +
          '何もない所をタップすると選択を解除します。';
      } else {
        el.innerHTML = '<b style="color:#2F9E44">追加できます</b> — ' +
          (tool === "text" ? "画像をタップするとその場で入力できます(Enterで確定)。"
                           : "画像をドラッグすると" + (tool === "arrow" ? "矢印" : "囲み") + "を描けます。") +
          "白い余白にも書けます。書いたものをタップすると編集できます。";
      }
    }

    function redraw() {
      if (!baseReady) return;
      updateHint();
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, PAD, PAD, imgW, imgH);
      const all = active ? strokes.concat([active]) : strokes;
      all.forEach((s, i) => {
        if (s.hidden) return;              // being retyped in the live box
        drawShape(s);
        if (i === sel && !active) outline(s);
      });
    }

    // Bounding box of a mark, used for selection and the highlight ring.
    // Box of a mark ignoring rotation ("local" space). Everything is stored
    // unrotated plus a rot angle, so this is the shape's own frame.
    function localBox(s) {
      if (s.type === "text") {
        const fs = Math.max(16, s.size * 4);
        const lines = String(s.text).split("\n");
        const w = Math.max(...lines.map(l => l.length)) * fs * 0.62;
        return { x1:s.x1, y1:s.y1, x2:s.x1 + w, y2:s.y1 + lines.length * fs * 1.25 };
      }
      return {
        x1:Math.min(s.x1, s.x2), y1:Math.min(s.y1, s.y2),
        x2:Math.max(s.x1, s.x2), y2:Math.max(s.y1, s.y2)
      };
    }
    function centreOf(s) {
      const b = localBox(s);
      return { x:(b.x1 + b.x2) / 2, y:(b.y1 + b.y2) / 2 };
    }
    // Convert between screen space and the mark's own rotated frame.
    function toWorld(pt, s) {
      const r = s.rot || 0;
      if (!r) return { x:pt.x, y:pt.y };
      const c0 = centreOf(s), cos = Math.cos(r), sin = Math.sin(r);
      const dx = pt.x - c0.x, dy = pt.y - c0.y;
      return { x:c0.x + dx*cos - dy*sin, y:c0.y + dx*sin + dy*cos };
    }
    function toLocal(pt, s) {
      const r = s.rot || 0;
      if (!r) return { x:pt.x, y:pt.y };
      const c0 = centreOf(s), cos = Math.cos(-r), sin = Math.sin(-r);
      const dx = pt.x - c0.x, dy = pt.y - c0.y;
      return { x:c0.x + dx*cos - dy*sin, y:c0.y + dx*sin + dy*cos };
    }
    // Kept for callers that just want the unrotated box.
    function bbox(s) { return localBox(s); }

    // The canvas is drawn at full image resolution but displayed shrunk to fit
    // the screen, so handle sizes are converted from on-screen pixels into
    // canvas pixels. Otherwise the grab targets end up far too small to hit.
    function dscale() {
      const r = canvas.getBoundingClientRect();
      return r.width ? canvas.width / r.width : 1;
    }
    function HPADv() { return 10 * dscale(); }   // gap between mark and ring
    function HRv() { return 16 * dscale(); }     // drawn radius of a handle
    function HITv() { return 30 * dscale(); }    // finger-friendly grab radius

    // Corner positions of the selection ring, used both for drawing the
    // handles and for working out whether a touch grabbed one.
    // Handle positions in screen space (corners for resizing, plus one grip
    // above the mark for rotating).
    function handles(s) {
      const b = localBox(s), g = HPADv();
      const local = [
        { id:"tl", x:b.x1 - g, y:b.y1 - g },
        { id:"tr", x:b.x2 + g, y:b.y1 - g },
        { id:"bl", x:b.x1 - g, y:b.y2 + g },
        { id:"br", x:b.x2 + g, y:b.y2 + g },
        { id:"rot", x:(b.x1 + b.x2) / 2, y:b.y1 - g - 34 * dscale() }
      ];
      return local.map(h => {
        const w = toWorld(h, s);
        return { id:h.id, x:w.x, y:w.y };
      });
    }

    function outline(s) {
      const b = localBox(s), g = HPADv(), r = HRv(), k = dscale();
      const c0 = centreOf(s);
      ctx.save();
      if (s.rot) {
        ctx.translate(c0.x, c0.y);
        ctx.rotate(s.rot);
        ctx.translate(-c0.x, -c0.y);
      }
      ctx.strokeStyle = "#1971C2";
      ctx.lineWidth = 2 * k;
      ctx.setLineDash([6 * k, 4 * k]);
      ctx.strokeRect(b.x1 - g, b.y1 - g, (b.x2 - b.x1) + g*2, (b.y2 - b.y1) + g*2);
      ctx.setLineDash([]);
      ctx.beginPath();                       // stem up to the rotate grip
      ctx.moveTo((b.x1 + b.x2) / 2, b.y1 - g);
      ctx.lineTo((b.x1 + b.x2) / 2, b.y1 - g - 34 * k);
      ctx.stroke();
      ctx.restore();

      for (const h of handles(s)) {
        const isRot = h.id === "rot";
        ctx.beginPath();
        ctx.arc(h.x, h.y, isRot ? r * 1.05 : r, 0, Math.PI * 2);
        ctx.fillStyle = isRot ? "#2F9E44" : "#1971C2";
        ctx.fill();
        ctx.beginPath();
        ctx.arc(h.x, h.y, r * 0.45, 0, Math.PI * 2);
        ctx.fillStyle = "#FFFFFF";
        ctx.fill();
      }
    }

    function hitTest(p) {
      const pad = 12 * dscale();
      for (let i = strokes.length - 1; i >= 0; i--) {
        const s = strokes[i];
        const q = toLocal(p, s);
        const b = localBox(s);
        if (q.x >= b.x1 - pad && q.x <= b.x2 + pad && q.y >= b.y1 - pad && q.y <= b.y2 + pad) return i;
      }
      return -1;
    }

    function handleAt(p) {
      if (sel < 0) return null;
      const lim = HITv();
      let best = null, bestD = Infinity;
      for (const h of handles(strokes[sel])) {
        const d = Math.hypot(p.x - h.x, p.y - h.y);
        if (d <= lim && d < bestD) { bestD = d; best = h.id; }
      }
      return best;
    }

    // Resize a mark around the corner opposite the one being dragged.
    function scaleShape(s, f, ax, ay) {
      const sc = (x, y) => ({ x: ax + (x - ax) * f, y: ay + (y - ay) * f });
      if (s.type === "text") {
        const a = sc(s.x1, s.y1);
        s.x1 = a.x; s.y1 = a.y;
        s.size = Math.max(2, s.size * f);
      } else {
        const a = sc(s.x1, s.y1), b2 = sc(s.x2, s.y2);
        s.x1 = a.x; s.y1 = a.y; s.x2 = b2.x; s.y2 = b2.y;
        s.size = Math.max(1, s.size * Math.sqrt(f));
      }
    }

    function drawShape(s) {
      ctx.save();
      if (s.rot) {                      // spin the mark about its own centre
        const b = localBox(s);
        ctx.translate((b.x1 + b.x2) / 2, (b.y1 + b.y2) / 2);
        ctx.rotate(s.rot);
        ctx.translate(-(b.x1 + b.x2) / 2, -(b.y1 + b.y2) / 2);
      }
      ctx.strokeStyle = s.color;
      ctx.fillStyle = s.color;
      ctx.lineWidth = s.size;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      if (s.type === "rect") {
        ctx.strokeRect(s.x1, s.y1, s.x2 - s.x1, s.y2 - s.y1);
      } else if (s.type === "arrow") {
        const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
        const ang = Math.atan2(dy, dx);
        const head = Math.max(12, s.size * 3.2);
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x2, s.y2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(s.x2, s.y2);
        ctx.lineTo(s.x2 - head * Math.cos(ang - Math.PI/7), s.y2 - head * Math.sin(ang - Math.PI/7));
        ctx.lineTo(s.x2 - head * Math.cos(ang + Math.PI/7), s.y2 - head * Math.sin(ang + Math.PI/7));
        ctx.closePath();
        ctx.fill();
      } else if (s.type === "text") {
        const fs = Math.max(16, s.size * 4);
        ctx.font = "bold " + fs + "px 'Hiragino Sans','Yu Gothic',sans-serif";
        ctx.textBaseline = "top";
        ctx.lineWidth = Math.max(3, fs / 7);
        ctx.strokeStyle = (s.color.toUpperCase() === "#FFFFFF") ? "#000000" : "#FFFFFF";
        const lines = String(s.text).split("\n");
        lines.forEach((ln, i) => {
          const y = s.y1 + i * fs * 1.25;
          ctx.strokeText(ln, s.x1, y);
          ctx.fillText(ln, s.x1, y);
        });
      }
      ctx.restore();
    }

    // Text is typed straight onto the picture: a transparent textarea is laid
    // over the canvas at the tap point, sized and coloured like the final mark,
    // so what you type is what you see. Committed on blur or Enter.
    let liveText = null;
    // Tapping the canvas first blurs the live textarea, which commits the text
    // and clears liveText — so by the time the tap reaches start() the guard is
    // already gone. This timestamp lets that first tap count only as "finish
    // typing" instead of also opening a new text box.
    let committedAt = 0;

    function openTextInput(canvasPt, existingIdx) {
      if (liveText) return;
      const s = existingIdx != null ? strokes[existingIdx] : null;
      const k = dscale();
      const r = canvas.getBoundingClientRect();
      const wrapRect = wrap.querySelector(".ecanvas-wrap").getBoundingClientRect();
      const fsCanvas = Math.max(16, (s ? s.size : size) * 4);
      const col = s ? s.color : stroke;

      const ta = document.createElement("textarea");
      ta.className = "elive";
      ta.value = s ? s.text : "";
      ta.rows = 1;
      // place it where the tap landed, converting canvas px back to screen px
      ta.style.left = (r.left - wrapRect.left + canvasPt.x / k) + "px";
      ta.style.top  = (r.top  - wrapRect.top  + canvasPt.y / k) + "px";
      ta.style.fontSize = (fsCanvas / k) + "px";
      ta.style.color = col;
      ta.style.textShadow = (col.toUpperCase() === "#FFFFFF")
        ? "0 0 3px #000, 0 0 3px #000" : "0 0 3px #fff, 0 0 3px #fff";
      wrap.querySelector(".ecanvas-wrap").appendChild(ta);

      if (s) { s.hidden = true; redraw(); }   // hide the original while editing
      liveText = { el:ta, pt:canvasPt, idx:existingIdx };
      setTimeout(() => { ta.focus(); ta.select(); }, 0);

      function autosize() {
        ta.style.width = "auto";
        ta.style.width = Math.max(60, ta.scrollWidth + 8) + "px";
        ta.style.height = "auto";
        ta.style.height = ta.scrollHeight + "px";
      }
      autosize();
      ta.addEventListener("input", autosize);
      ta.addEventListener("keydown", ev => {
        if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); commitText(); }
        if (ev.key === "Escape") { ev.preventDefault(); commitText(true); }
      });
      ta.addEventListener("blur", () => commitText());
    }

    function commitText(cancel) {
      if (!liveText) return;
      const { el, pt, idx } = liveText;
      const txt = el.value.replace(/\s+$/, "");
      liveText = null;
      committedAt = Date.now();
      if (el.parentNode) el.parentNode.removeChild(el);

      if (idx != null) {
        const s = strokes[idx];
        delete s.hidden;
        if (!cancel) {
          if (txt.trim()) { s.text = txt; sel = idx; }
          else { strokes.splice(idx, 1); sel = -1; }
        }
      } else if (!cancel && txt.trim()) {
        strokes.push({ type:"text", text:txt, x1:pt.x, y1:pt.y, color:stroke, size:size });
        sel = strokes.length - 1;
      }
      redraw();
    }

    function pos(e) {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return {
        x: (t.clientX - r.left) * (canvas.width / r.width),
        y: (t.clientY - r.top) * (canvas.height / r.height)
      };
    }

    let dragFrom = null;      // last pointer position while moving a mark
    let resizing = null;      // { ax, ay, d0 } while dragging a corner handle
    let rotating = null;      // { cx, cy, a0, r0 } while dragging the rotate grip
    let movedFar = false;     // distinguishes a tap from a drag
    let tapCandidate = -1;    // text mark that a still tap would reopen
    let downAt = null;

    function start(e) {
      if (!baseReady) return;
      if (liveText) { commitText(); return; }          // finish typing first
      if (Date.now() - committedAt < 400) return;      // that tap only confirmed
      e.preventDefault();
      const p = pos(e);
      downAt = p;
      movedFar = false;
      tapCandidate = -1;

      // 1. grabbing a corner handle of the selected mark => resize
      const h = handleAt(p);   // "tl".."br", "rot", or null
      if (h === "rot") {
        const s = strokes[sel];
        const c0 = centreOf(s);
        rotating = {
          cx: c0.x, cy: c0.y,
          a0: Math.atan2(p.y - c0.y, p.x - c0.x),
          r0: s.rot || 0
        };
        return;
      }
      if (h) {
        const s = strokes[sel];
        const b = localBox(s);
        const q = toLocal(p, s);                    // work in the mark's frame
        const ax = h.includes("l") ? b.x2 : b.x1;   // anchor = opposite corner
        const ay = h.includes("t") ? b.y2 : b.y1;
        const min = 12 * dscale();
        resizing = { ax:ax, ay:ay, d0: Math.max(min, Math.hypot(q.x - ax, q.y - ay)) };
        return;
      }

      // 2. touching an existing mark => select it and start moving.
      // If it is text that was already selected, a tap that never travels
      // reopens it for retyping; the decision is made in end(), so dragging
      // still just moves it.
      const hit = hitTest(p);
      if (hit >= 0) {
        tapCandidate = (strokes[hit].type === "text" && sel === hit) ? hit : -1;
        sel = hit;
        dragFrom = p;
        redraw();
        return;
      }

      // 3. empty space. While something is selected the canvas is in "edit"
      // mode: this tap only clears the selection, so a slightly-off grab never
      // turns into an unwanted new mark. Drawing resumes on the next tap, once
      // nothing is selected.
      if (sel >= 0) {
        sel = -1;
        redraw();
        return;
      }
      if (tool === "text") {
        openTextInput(p, null);
        return;
      }
      active = { type:tool, x1:p.x, y1:p.y, x2:p.x, y2:p.y, color:stroke, size:size };
      redraw();
    }

    function move(e) {
      if (!resizing && !rotating && !dragFrom && !active) return;
      e.preventDefault();
      const p = pos(e);
      if (downAt && Math.hypot(p.x - downAt.x, p.y - downAt.y) > 6 * dscale()) movedFar = true;

      if (rotating) {
        const a = Math.atan2(p.y - rotating.cy, p.x - rotating.cx);
        strokes[sel].rot = rotating.r0 + (a - rotating.a0);
        redraw();
        return;
      }
      if (resizing) {
        const min = 12 * dscale();
        const q = toLocal(p, strokes[sel]);
        const d = Math.max(min, Math.hypot(q.x - resizing.ax, q.y - resizing.ay));
        const f = d / resizing.d0;
        if (f > 0.02 && f < 50) {
          scaleShape(strokes[sel], f, resizing.ax, resizing.ay);
          resizing.d0 = d;
          redraw();
        }
        return;
      }
      if (dragFrom) {
        const dx = p.x - dragFrom.x, dy = p.y - dragFrom.y;
        const s = strokes[sel];
        s.x1 += dx; s.y1 += dy;
        if (s.x2 != null) { s.x2 += dx; s.y2 += dy; }
        dragFrom = p;
        redraw();
        return;
      }
      active.x2 = p.x; active.y2 = p.y;
      redraw();
    }

    function end() {
      const wasDragging = dragFrom != null;
      dragFrom = null;
      resizing = null;
      rotating = null;
      downAt = null;

      // A still tap on already-selected text means "let me retype this".
      if (wasDragging && !movedFar && tapCandidate >= 0) {
        const i = tapCandidate;
        tapCandidate = -1;
        openTextInput({ x:strokes[i].x1, y:strokes[i].y1 }, i);
        return;
      }
      tapCandidate = -1;

      if (!active) return;
      const a = active;
      active = null;
      const tiny = Math.abs(a.x2 - a.x1) < 5 && Math.abs(a.y2 - a.y1) < 5;
      if (!tiny) { strokes.push(a); sel = strokes.length - 1; }
      redraw();
    }

    canvas.addEventListener("mousedown", start);
    canvas.addEventListener("mousemove", move);
    window.addEventListener("mouseup", end);
    canvas.addEventListener("touchstart", start, { passive:false });
    canvas.addEventListener("touchmove", move, { passive:false });
    canvas.addEventListener("touchend", end);

    wrap.querySelectorAll(".etool").forEach(b => b.onclick = () => {
      tool = b.dataset.tool;
      redraw();
      wrap.querySelectorAll(".etool").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
    });
    wrap.querySelectorAll(".ecolor").forEach(b => b.onclick = () => {
      stroke = b.dataset.color;
      wrap.querySelectorAll(".ecolor").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      if (sel >= 0) { strokes[sel].color = stroke; redraw(); }
    });
    wrap.querySelectorAll(".esize").forEach(b => b.onclick = () => {
      size = Number(b.dataset.size);
      wrap.querySelectorAll(".esize").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      if (sel >= 0) { strokes[sel].size = size; redraw(); }
    });
    wrap.querySelector("#eundo").onclick = () => { strokes.pop(); sel = -1; redraw(); };
    wrap.querySelector("#edel").onclick = () => {
      if (sel < 0) { alert("消したい書き込みをタップして選んでから押してください。"); return; }
      strokes.splice(sel, 1);
      sel = -1;
      redraw();
    };
    wrap.querySelector("#eclear").onclick = () => {
      if (!strokes.length) return;
      if (confirm("書き込みをすべて消します。よろしいですか?")) { strokes = []; sel = -1; redraw(); }
    };

    function cleanup() {
      window.removeEventListener("mouseup", end);
      document.body.removeChild(wrap);
    }
    wrap.querySelector("#ecancel").onclick = () => { cleanup(); resolve(null); };
    wrap.querySelector("#edone").onclick = () => {
      commitText();
      sel = -1;
      redraw();
      const marks = strokes.map(norm);
      canvas.toBlob(b => { cleanup(); resolve({ blob: b, marks: marks }); }, "image/jpeg", 0.88);
    };

    img.onload = () => {
      baseReady = true;
      fit();
      strokes = (existing || []).map(denorm);
      redraw();
    };
    img.onerror = () => { cleanup(); resolve(null); };
    img.src = src;
  });
}

function blobToUrlSrc(fileOrBlob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(fileOrBlob);
  });
}

// A photo is stored as { base, display, marks }:
//   base    = the clean uploaded original (never changes)
//   marks   = the annotation shapes, kept as data so they stay editable
//   display = base + marks flattened, re-uploaded whenever marks change
// Older entries were plain URL strings with the marks already burned in;
// those are wrapped so they still show, but start with no editable marks.
function asPhoto(v) {
  if (!v) return null;
  if (typeof v === "string") return { base: v, display: v, marks: [], note: "" };
  return { base: v.base, display: v.display || v.base, marks: v.marks || [], note: v.note || "" };
}
function photoSrc(v) { const p = asPhoto(v); return p ? p.display : ""; }
function photoNote(v) { const p = asPhoto(v); return p ? p.note : ""; }

function getPhotoEntry(target, key, idx) {
  return target === "item" ? asPhoto(photosOf(key)[idx]) : asPhoto(matPhotos[key]);
}
function putPhotoEntry(target, key, idx, entry) {
  if (target === "item") {
    const list = photosOf(key).slice();
    if (idx == null) list.push(entry); else list[idx] = entry;
    setPhotosOf(key, list);
  } else matPhotos[key] = entry;
}

async function setPhoto(target, key, useCamera) {
  const file = await pickFile(useCamera);
  if (!file) return;
  let src;
  try { src = await blobToUrlSrc(file); }
  catch (e) { status = { type:"err", msg:"画像を読めませんでした" }; render(); return; }
  const result = await annotateImage(src, []);
  if (!result) return;
  await withSave(async () => {
    const baseUrl = await uploadImage(file);
    const displayUrl = result.marks.length ? await uploadImage(result.blob) : baseUrl;
    putPhotoEntry(target, key, null, { base: baseUrl, display: displayUrl, marks: result.marks });
  }, "写真を登録しました");
}

// Re-open the editor on a photo that is already registered.
// For items, idx selects which of the item's photos to edit.
async function annotateExisting(target, key, idx) {
  const entry = getPhotoEntry(target, key, idx);
  if (!entry) return;
  const result = await annotateImage(entry.base, entry.marks);
  if (!result) return;
  await withSave(async () => {
    const displayUrl = result.marks.length ? await uploadImage(result.blob) : entry.base;
    putPhotoEntry(target, key, idx, {
      base: entry.base, display: displayUrl, marks: result.marks, note: entry.note
    });
  }, "書き込みを保存しました");
}

// Captions are shown only in the enlarged view, so they can be long without
// crowding the thumbnails.
async function editNote(target, key, idx) {
  const entry = getPhotoEntry(target, key, idx);
  if (!entry) return;
  openModal({
    title: "この写真の説明",
    message: "拡大表示したときに写真の下に出ます。空欄にすると消えます。",
    fields: [
      { key:"note", label:"説明", value: entry.note || "", textarea:true }
    ],
    onSubmit: async vals => {
      await withSave(async () => {
        putPhotoEntry(target, key, idx, {
          base: entry.base, display: entry.display, marks: entry.marks, note: vals.note.trim()
        });
      }, "説明を保存しました");
    }
  });
}

async function clearPhoto(target, key, idx) {
  await withSave(async () => {
    if (target === "item") {
      const list = photosOf(key).slice();
      list.splice(idx, 1);
      setPhotosOf(key, list);
    } else delete matPhotos[key];
  }, "写真を削除しました");
}

// Full-screen photo viewer. Tapping any thumbnail opens the picture large,
// with pinch-zoom left to the browser and a tap anywhere to close.
// `list` is the set of photo entries to page through, `start` the one tapped.
// Swiping left/right moves between them and each photo's note is shown below.
function openLightbox(list, start) {
  const photos = (list || []).filter(Boolean);
  if (!photos.length) return;
  let i = Math.max(0, Math.min(start || 0, photos.length - 1));

  const bg = document.createElement("div");
  bg.className = "lightbox";
  bg.innerHTML =
    '<button class="lbclose" aria-label="閉じる">✕</button>' +
    '<button class="lbfit">画面いっぱい</button>' +
    '<button class="lbnav lbprev" aria-label="前へ">‹</button>' +
    '<button class="lbnav lbnext" aria-label="次へ">›</button>' +
    '<div class="lbstage"><img alt="" /></div>' +
    '<div class="lbfoot"><p class="lbnote"></p><p class="lbcount"></p></div>';
  document.body.appendChild(bg);

  const imgEl = bg.querySelector("img");
  const noteEl = bg.querySelector(".lbnote");
  const countEl = bg.querySelector(".lbcount");
  const prevEl = bg.querySelector(".lbprev");
  const nextEl = bg.querySelector(".lbnext");
  const fitEl = bg.querySelector(".lbfit");

  // A photo rarely matches the phone's aspect ratio, so showing all of it
  // always leaves black bars. This toggle lets the picture fill the screen
  // instead, trading the edges for size.
  let filled = true;   // open filled; the toggle backs off to whole-photo view
  fitEl.onclick = e => {
    e.stopPropagation();
    filled = !filled;
    applyFit();
  };

  function applyFit() {
    imgEl.style.objectFit = filled ? "cover" : "contain";
    imgEl.style.width = filled ? "100%" : "auto";
    imgEl.style.height = filled ? "100%" : "auto";
    fitEl.textContent = filled ? "全体を表示" : "画面いっぱい";
  }

  function show() {
    const p = asPhoto(photos[i]);
    imgEl.src = p.display;
    applyFit();
    noteEl.textContent = p.note || "";
    noteEl.style.display = p.note ? "block" : "none";
    countEl.textContent = photos.length > 1 ? (i + 1) + " / " + photos.length : "";
    countEl.style.display = photos.length > 1 ? "block" : "none";
    prevEl.style.visibility = photos.length > 1 ? "visible" : "hidden";
    nextEl.style.visibility = photos.length > 1 ? "visible" : "hidden";
    const foot = bg.querySelector(".lbfoot");
    foot.style.display = (p.note || photos.length > 1) ? "block" : "none";
  }
  function go(step) {
    i = (i + step + photos.length) % photos.length;
    show();
  }
  const close = () => { if (bg.parentNode) document.body.removeChild(bg); };

  bg.onclick = e => { if (e.target === bg || e.target.classList.contains("lbstage")) close(); };
  bg.querySelector(".lbclose").onclick = close;
  prevEl.onclick = e => { e.stopPropagation(); go(-1); };
  nextEl.onclick = e => { e.stopPropagation(); go(1); };

  // horizontal swipe to page through
  let sx = null, sy = null;
  bg.addEventListener("touchstart", e => {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive:true });
  bg.addEventListener("touchend", e => {
    if (sx == null) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
  }, { passive:true });

  show();
}

// ---------- modals ----------
function openModal(cfg) { modal = cfg; renderModal(); }
function closeModal() { modal = null; renderModal(); }

// Categories are not stored separately: they live on the material rows. So
// renaming one means rewriting every row that carries it, and a brand-new
// category has nothing to attach to until it gets its first item.
function categoryFormModal(existingCat) {
  const count = existingCat
    ? [...itemMap.values()].filter(i => (i.category || "その他") === existingCat).length
    : 0;
  openModal({
    title: existingCat ? "商品分類を編集" : "商品分類を追加",
    message: existingCat ? ("この分類の品目: " + count + " 件") : "",
    fields: [
      { key:"name", label:"分類名", value: existingCat || "", required:true }
    ],
    extraButton: existingCat
      ? { label:"この分類を削除", danger:true, onClick: () => deleteCategoryModal(existingCat, count) }
      : null,
    onSubmit: async vals => {
      const name = vals.name.trim();
      if (!name) throw new Error("分類名を入力してください");
      if (!existingCat) {
        if (allCats().includes(name) || pendingCats.includes(name)) {
          throw new Error("その分類はすでにあります");
        }
        pendingCats.push(name);
        activeCat = name;
        render();
        return;
      }
      if (name === existingCat) return;
      await withSave(async () => {
        for (const r of rows) if ((r.category || "その他") === existingCat) r.category = name;
        pendingCats = pendingCats.filter(x => x !== existingCat);
        activeCat = name;
      }, "分類名を変更しました");
    }
  });
}

function deleteCategoryModal(cat, count) {
  if (!count) {
    pendingCats = pendingCats.filter(x => x !== cat);
    activeCat = "全て";
    closeModal();
    render();
    return;
  }
  const others = allCats().filter(x => x !== cat);
  openModal({
    title: "分類を削除",
    message: "「" + cat + "」には品目が " + count + " 件あります。品目の移動先を選ぶか、空欄のままにすると「その他」になります。",
    fields: [
      { key:"moveTo", label:"移動先の分類", value: others[0] || "その他", list: others.concat(["その他"]) }
    ],
    danger: true,
    onSubmit: async vals => {
      const to = vals.moveTo.trim() || "その他";
      await withSave(async () => {
        for (const r of rows) if ((r.category || "その他") === cat) r.category = to;
        pendingCats = pendingCats.filter(x => x !== cat);
        activeCat = "全て";
      }, "分類を削除しました");
    }
  });
}

// Copies a品目 along with every material row attached to it. Material photos
// are keyed by material name and so are shared automatically; the item's own
// photos are copied across only if asked, since they show the actual product.
function duplicateItemModal(srcItem) {
  const src = itemMap.get(srcItem);
  if (!src) return;
  const srcPhotos = photosOf(srcItem);
  openModal({
    title: "品目を複製",
    message: "「" + srcItem + "」の資材 " + src.materials.length + " 件をそのままコピーします。",
    fields: [
      { key:"item", label:"新しい品目名", value: srcItem + " のコピー", required:true },
      { key:"category", label:"商品分類", value: src.category || "", list: allCats() },
      { key:"copyPhotos", label:"商品写真もコピーする(" + srcPhotos.length + "枚)",
        value: srcPhotos.length ? "はい" : "いいえ", list:["はい","いいえ"] }
    ],
    onSubmit: async vals => {
      const name = vals.item.trim();
      if (!name) throw new Error("品目名を入力してください");
      if (itemMap.has(name)) throw new Error("その品目名はすでにあります");
      await withSave(async () => {
        for (const m of src.materials) {
          rows.push({
            id: newId(),
            item: name,
            category: vals.category.trim(),
            sale_type: m.sale_type || "",
            material_category: m.material_category || "未分類",
            material_name: m.material_name || "",
            supplier: m.supplier || "",
            common_or_dedicated: m.common_or_dedicated || "",
            memo: m.memo || ""
          });
        }
        if (vals.copyPhotos.trim() === "はい" && srcPhotos.length) {
          setPhotosOf(name, srcPhotos.map(p => {
            const e = asPhoto(p);
            return { base:e.base, display:e.display, marks:e.marks, note:e.note };
          }));
        }
        selected = name;
        activeCat = "全て";
      }, "品目を複製しました");
    }
  });
}

function itemFormModal(existingItem, presetCat) {
  const cur = existingItem ? itemMap.get(existingItem) : null;
  const first = cur ? cur.materials[0] : null;
  openModal({
    title: cur ? "品目を編集" : (presetCat ? presetCat + " に品目を追加" : "品目を追加"),
    fields: [
      { key:"item", label:"品目名", value: cur ? cur.item : "", required:true },
      { key:"category", label:"商品分類",
        value: cur ? (cur.category||"") : (presetCat || ""), list: allCats() },
      { key:"sale_type", label:"販売区分", value: first ? (first.sale_type||"通常") : "通常",
        list:["通常","レギュラー","予定数","IDF"] },
      { key:"memo", label:"メモ(任意)", value: cur ? (cur.memo||"") : "", textarea:true },
    ],
    onSubmit: async vals => {
      if (!vals.item.trim()) throw new Error("品目名を入力してください");
      await withSave(async () => {
        if (cur) {
          const oldName = cur.item;
          for (const r of rows) {
            if (r.item === oldName) {
              r.item = vals.item.trim();
              r.category = vals.category.trim();
              r.memo = vals.memo;
            }
          }
          if (oldName !== vals.item.trim() && itemPhotos[oldName]) {
            setPhotosOf(vals.item.trim(), photosOf(oldName));
            delete itemPhotos[oldName];
          }
          selected = vals.item.trim();
        } else {
          const id = newId();
          rows.push({
            id, item: vals.item.trim(), category: vals.category.trim(),
            sale_type: vals.sale_type.trim(), material_category:"未分類",
            material_name:"(資材を追加してください)", supplier:"",
            common_or_dedicated:"", memo: vals.memo
          });
          selected = vals.item.trim();
        }
      }, cur ? "品目を更新しました" : "品目を追加しました");
    }
  });
}

// Unique materials across every item, so an existing one can be reused
// instead of retyped. Photos are keyed by name, so reuse brings the photo too.
function knownMaterials() {
  const map = new Map();
  for (const r of rows) {
    const n = (r.material_name || "").trim();
    if (!n || n === "(資材を追加してください)") continue;
    if (!map.has(n)) {
      map.set(n, {
        material_name: n,
        material_category: r.material_category || "",
        supplier: r.supplier || "",
        common_or_dedicated: r.common_or_dedicated || "",
        uses: 0,
        morder: (typeof r.morder === "number") ? r.morder : null
      });
    }
    // Holder rows (no item) keep an unused material alive in the master, so
    // they must not count towards how many items use it.
    if (r.item) map.get(n).uses++;
    if (typeof r.morder === "number" && map.get(n).morder == null) map.get(n).morder = r.morder;
  }
  // Hand-placed materials come first in their set position; the rest keep the
  // old "most used, then by name" ordering underneath.
  return [...map.values()].sort((a, b) => {
    const ao = a.morder == null ? Infinity : a.morder;
    const bo = b.morder == null ? Infinity : b.morder;
    if (ao !== bo) return ao - bo;
    return b.uses - a.uses || a.material_name.localeCompare(b.material_name, "ja");
  });
}

// Write positions back onto every row carrying each material name.
function applyMatOrder(orderedNames) {
  orderedNames.forEach((name, idx) => {
    for (const r of rows) if (r.material_name === name) r.morder = idx;
  });
}

// Editing from the master rewrites every row using this material, so the
// change is reflected in all the items that use it.
// Material categories are just a field on the rows, so renaming one means
// rewriting every material that carries it.
function matCategoryModal(cat) {
  const count = knownMaterials().filter(m => (m.material_category || "未分類") === cat).length;
  const others = [...new Set(rows.map(r => r.material_category).filter(Boolean))]
    .filter(x => x !== cat);
  openModal({
    title: "資材区分の名前を変更",
    message: "「" + cat + "」の資材 " + count + " 件すべてに反映されます。",
    fields: [
      { key:"name", label:"区分名", value: cat, list: others, required:true }
    ],
    onSubmit: async vals => {
      const name = vals.name.trim();
      if (!name) throw new Error("区分名を入力してください");
      if (name === cat) return;
      await withSave(async () => {
        for (const r of rows) {
          if ((r.material_category || "未分類") === cat) r.material_category = name;
        }
      }, "区分名を変更しました");
    }
  });
}

function masterMaterialModal(info, presetCat) {
  const matCats = [...new Set(rows.map(r => r.material_category).filter(Boolean))];
  const suppliers = [...new Set(rows.map(r => r.supplier).filter(Boolean))];
  openModal({
    title: info ? "資材を編集" : (presetCat ? presetCat + " に資材を追加" : "資材を追加"),
    message: info ? ("この資材を使っている品目すべてに反映されます。") : "",
    fields: [
      { key:"material_name", label:"資材名・型番", value: info ? info.material_name : "", required:true },
      { key:"material_category", label:"資材区分",
        value: info ? info.material_category : (presetCat && presetCat !== "未分類" ? presetCat : ""),
        list: matCats },
      { key:"supplier", label:"仕入先", value: info ? info.supplier : "", list: suppliers },
      { key:"common_or_dedicated", label:"共通/専用", value: info ? (info.common_or_dedicated || "共通") : "共通",
        list:["共通","専用"] }
    ],
    onSubmit: async vals => {
      const name = vals.material_name.trim();
      if (!name) throw new Error("資材名を入力してください");
      const exists = knownMaterials().some(m => m.material_name === name);
      if (!info && exists) throw new Error("その資材はすでにあります");
      if (info && name !== info.material_name && exists) throw new Error("その資材名はすでにあります");

      await withSave(async () => {
        if (!info) {
          // A material with no item yet is parked on a holder row so it shows
          // up in the master and in the picker until it gets used.
          rows.push({
            id: newId(), item: "", category: "",
            sale_type: "", material_category: vals.material_category.trim() || "未分類",
            material_name: name, supplier: vals.supplier.trim(),
            common_or_dedicated: vals.common_or_dedicated.trim(), memo: ""
          });
        } else {
          const old = info.material_name;
          for (const r of rows) {
            if (r.material_name === old) {
              r.material_name = name;
              r.material_category = vals.material_category.trim() || "未分類";
              r.supplier = vals.supplier.trim();
              r.common_or_dedicated = vals.common_or_dedicated.trim();
            }
          }
          if (old !== name && matPhotos[old]) {
            matPhotos[name] = matPhotos[old];
            delete matPhotos[old];
          }
        }
        selectedMat = name;
      }, info ? "資材を更新しました" : "資材を追加しました");
    }
  });
}

function duplicateMaterialModal(info) {
  const matCats = [...new Set(rows.map(r => r.material_category).filter(Boolean))];
  const suppliers = [...new Set(rows.map(r => r.supplier).filter(Boolean))];
  openModal({
    title: "資材を複製",
    message: "「" + info.material_name + "」の内容をコピーして新しい資材を作ります。",
    fields: [
      { key:"material_name", label:"新しい資材名", value: info.material_name + " のコピー", required:true },
      { key:"material_category", label:"資材区分", value: info.material_category, list: matCats },
      { key:"supplier", label:"仕入先", value: info.supplier, list: suppliers },
      { key:"common_or_dedicated", label:"共通/専用", value: info.common_or_dedicated || "共通", list:["共通","専用"] },
      { key:"copyPhoto", label:"写真もコピーする", value: matPhotos[info.material_name] ? "はい" : "いいえ",
        list:["はい","いいえ"] }
    ],
    onSubmit: async vals => {
      const name = vals.material_name.trim();
      if (!name) throw new Error("資材名を入力してください");
      if (knownMaterials().some(m => m.material_name === name)) throw new Error("その資材名はすでにあります");
      await withSave(async () => {
        rows.push({
          id: newId(), item: "", category: "",
          sale_type: "", material_category: vals.material_category.trim() || "未分類",
          material_name: name, supplier: vals.supplier.trim(),
          common_or_dedicated: vals.common_or_dedicated.trim(), memo: ""
        });
        if (vals.copyPhoto.trim() === "はい" && matPhotos[info.material_name]) {
          const e = asPhoto(matPhotos[info.material_name]);
          matPhotos[name] = { base:e.base, display:e.display, marks:e.marks, note:e.note };
        }
        selectedMat = name;
      }, "資材を複製しました");
    }
  });
}

function removeMaterialModal(info, useCount) {
  openModal({
    title: "資材を削除",
    message: useCount
      ? "この資材は " + useCount + " 品目で使われています。削除するとその品目からも外れます。"
      : "この資材を削除します。",
    fields: [],
    danger: true,
    onSubmit: async () => {
      await withSave(async () => {
        rows = rows.filter(r => r.material_name !== info.material_name);
        delete matPhotos[info.material_name];
        selectedMat = null;
      }, "資材を削除しました");
    }
  });
}

function materialFormModal(existingRow, presetCat) {
  const cur = itemMap.get(selected);
  const matCats = [...new Set(rows.map(r => r.material_category).filter(Boolean))];
  const suppliers = [...new Set(rows.map(r => r.supplier).filter(Boolean))];
  const usedHere = new Set(cur.materials.map(m => m.material_name));
  const reusable = existingRow ? [] : knownMaterials().filter(k => !usedHere.has(k.material_name));
  const sharedWith = existingRow
    ? knownMaterials().find(k => k.material_name === existingRow.material_name)
    : null;
  openModal({
    title: existingRow ? "資材を編集" : "資材を追加",
    message: (sharedWith && sharedWith.uses > 1)
      ? "この資材は " + sharedWith.uses + " 品目で使われています。変更はすべてに反映されます。"
      : "",
    picker: reusable,
    fields: [
      { key:"material_name", label:"資材名・型番", value: existingRow ? existingRow.material_name : "", required:true },
      { key:"material_category", label:"資材区分",
        value: existingRow ? existingRow.material_category
                           : (presetCat && presetCat !== "未分類" ? presetCat : ""),
        list: matCats },
      { key:"supplier", label:"仕入先", value: existingRow ? existingRow.supplier : "", list: suppliers },
      { key:"common_or_dedicated", label:"共通/専用", value: existingRow ? existingRow.common_or_dedicated : "共通",
        list:["共通","専用"] },
      { key:"sale_type", label:"販売区分", value: existingRow ? existingRow.sale_type : "通常",
        list:["通常","レギュラー","予定数","IDF"] },
    ],
    onSubmit: async vals => {
      if (!vals.material_name.trim()) throw new Error("資材名を入力してください");
      if (existingRow) {
        const newName = vals.material_name.trim();
        if (newName !== existingRow.material_name &&
            knownMaterials().some(k => k.material_name === newName)) {
          throw new Error("「" + newName + "」はすでにある資材です。別の名前にしてください。");
        }
      }
      await withSave(async () => {
        if (existingRow) {
          // A material is one shared thing, so editing it here updates every
          // row carrying the same name. Only 販売区分 stays per-item, since
          // that describes this item's use of it rather than the material.
          const oldName = existingRow.material_name;
          const newName = vals.material_name.trim();
          for (const r of rows) {
            if (r.material_name !== oldName) continue;
            r.material_name = newName;
            r.material_category = vals.material_category.trim() || "未分類";
            r.supplier = vals.supplier.trim();
            r.common_or_dedicated = vals.common_or_dedicated.trim();
          }
          existingRow.sale_type = vals.sale_type.trim();
          if (oldName !== newName && matPhotos[oldName]) {
            matPhotos[newName] = matPhotos[oldName];
            delete matPhotos[oldName];
          }
        } else {
          rows.push({
            id: newId(), item: cur.item, category: cur.category || "",
            sale_type: vals.sale_type.trim(),
            material_category: vals.material_category.trim() || "未分類",
            material_name: vals.material_name.trim(),
            supplier: vals.supplier.trim(),
            common_or_dedicated: vals.common_or_dedicated.trim(), memo:""
          });
        }
        // drop the auto placeholder row once a real material exists
        const ph = rows.filter(r => r.item === cur.item && r.material_name === "(資材を追加してください)");
        if (ph.length && rows.filter(r => r.item === cur.item).length > ph.length) {
          for (const p of ph) rows.splice(rows.indexOf(p), 1);
        }
      }, existingRow ? "資材を更新しました" : "資材を追加しました");
    }
  });
}

function confirmModal(title, msg, onYes) {
  openModal({ title, message: msg, fields: [], danger:true, onSubmit: async () => { await onYes(); } });
}

function renderModal() {
  const root = document.getElementById("modalRoot");
  if (!modal) { root.innerHTML = ""; return; }
  const c = color(itemMap.get(selected) ? itemMap.get(selected).category : "");
  let html = '<div class="modal-bg" id="mbg"><div class="modal">';
  html += "<h3>" + esc(modal.title) + "</h3>";
  html += '<div class="modal-body">';
  if (modal.message) html += '<p style="font-size:13px;color:#5A5648;margin:0 0 12px">' + esc(modal.message) + "</p>";
  if (modal.picker && modal.picker.length) {
    html += '<div class="field"><label>登録済みの資材から選ぶ(任意)</label>';
    html += '<div class="picker" id="picker">';
    for (const k of modal.picker) {
      const ph = photoSrc(matPhotos[k.material_name]);
      const thumb = ph
        ? '<img class="pthumb" src="' + esc(ph) + '" onerror="this.style.display=\'none\'" />'
        : '<div class="pthumb empty">写真<br>なし</div>';
      html += '<button type="button" class="pitem" data-pick="' + esc(k.material_name) +
        '" data-cat="' + esc(k.material_category || "未分類") + '">' +
        thumb +
        '<span class="pbody"><span class="pname">' + esc(k.material_name) + '</span>' +
        '<span class="pmeta">' + esc(k.material_category || "区分なし") +
        (k.supplier ? " ・ " + esc(k.supplier) : "") +
        " ・ " + k.uses + "品目で使用</span></span></button>";
    }
    html += "</div>";
    html += '<p class="pickerempty" id="pickerempty" style="display:none;font-size:12px;color:#9A9382;' +
            'padding:10px 4px;margin:0">この区分に登録済みの資材はまだありません。</p>';
    html += '<p style="font-size:11px;color:#9A9382;margin:6px 0 0">タップすると下の欄が自動入力されます。写真も引き継がれます。</p>';
    html += "</div>";
  }
  for (const f of (modal.fields || [])) {
    html += '<div class="field"><label>' + esc(f.label) + "</label>";
    if (f.textarea) {
      html += '<textarea id="f_' + f.key + '">' + esc(f.value) + "</textarea>";
    } else if (f.list && f.list.length) {
      // A real <select> rather than a datalist: input+datalist is unreliable on
      // mobile browsers, where it often behaves like a plain text box. The last
      // entry switches to a text field so a new value can still be typed.
      const opts = [...new Set(f.list.filter(Boolean))];
      const known = f.value && opts.includes(f.value);
      html += '<select id="s_' + f.key + '" data-key="' + f.key + '">';
      if (!f.value) html += '<option value="" selected>選択してください</option>';
      for (const o of opts) {
        html += '<option value="' + esc(o) + '"' + (known && o === f.value ? " selected" : "") + ">" +
                esc(o) + "</option>";
      }
      const custom = f.value && !known;
      html += '<option value="__new__"' + (custom ? " selected" : "") + ">＋ 新しく入力する</option>";
      html += "</select>";
      html += '<input id="f_' + f.key + '" value="' + esc(f.value) + '" placeholder="新しい名前を入力" ' +
              'style="margin-top:6px;' + (custom ? "" : "display:none") + '" />';
    } else {
      html += '<input id="f_' + f.key + '" value="' + esc(f.value) + '" />';
    }
    html += "</div>";
  }
  if (modal.extraButton) {
    html += '<button class="btn" id="mextra" style="width:100%;margin-top:4px;background:#fff;' +
            'border:1px solid #D8D2C0;color:' + (modal.extraButton.danger ? "#B5552F" : "#5A5648") + '">' +
            esc(modal.extraButton.label) + "</button>";
  }
  html += "</div>";   // end .modal-body
  html += '<div class="modal-actions">';
  html += '<button class="btn" id="mcancel" style="background:#fff;border:1px solid #D8D2C0;color:#5A5648">キャンセル</button>';
  html += '<button class="btn" id="mok" style="background:' + (modal.danger ? "#B5552F" : c) + '">' +
          (modal.danger ? "削除する" : "保存") + "</button>";
  html += "</div></div></div>";
  root.innerHTML = html;

  const extra = document.getElementById("mextra");
  if (extra) extra.onclick = () => modal.extraButton.onClick();

  // Set both halves of a field: the dropdown if the value is one of the
  // existing options, otherwise the free-text box.
  function setField(key, v) {
    const sel = document.getElementById("s_" + key);
    const txt = document.getElementById("f_" + key);
    if (txt) txt.value = v || "";
    if (!sel) return;
    const has = [...sel.options].some(o => o.value === v);
    if (has) {
      sel.value = v;
      if (txt) txt.style.display = "none";
    } else if (v) {
      sel.value = "__new__";
      if (txt) txt.style.display = "";
    }
  }

  root.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    const k = (modal.picker || []).find(x => x.material_name === b.dataset.pick);
    if (!k) return;
    setField("material_name", k.material_name);
    setField("material_category", k.material_category);
    setField("supplier", k.supplier);
    setField("common_or_dedicated", k.common_or_dedicated || "共通");
    root.querySelectorAll("[data-pick]").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel");
  });

  // Narrow the "pick an existing material" list to the chosen 資材区分, so a
  // long list becomes just the handful that belong in that group.
  function filterPicker() {
    const box = document.getElementById("picker");
    if (!box) return;
    const selCat = document.getElementById("s_material_category");
    const txtCat = document.getElementById("f_material_category");
    let cat = "";
    if (selCat && selCat.value && selCat.value !== "__new__") cat = selCat.value;
    else if (txtCat) cat = txtCat.value.trim();

    let shown = 0;
    box.querySelectorAll("[data-pick]").forEach(b => {
      const ok = !cat || b.dataset.cat === cat;
      b.style.display = ok ? "" : "none";
      if (ok) shown++;
    });
    const empty = document.getElementById("pickerempty");
    box.style.display = shown ? "" : "none";
    if (empty) empty.style.display = shown ? "none" : "block";
  }

  root.querySelectorAll("select[data-key]").forEach(sel => {
    const key = sel.dataset.key;
    const txt = document.getElementById("f_" + key);
    sel.onchange = () => {
      if (txt) {
        if (sel.value === "__new__") {
          txt.style.display = "";
          txt.value = "";
          txt.focus();
        } else {
          txt.style.display = "none";
          txt.value = sel.value;
        }
      }
      if (key === "material_category") filterPicker();
    };
  });
  const catTxt = document.getElementById("f_material_category");
  if (catTxt) catTxt.addEventListener("input", filterPicker);
  filterPicker();

  document.getElementById("mcancel").onclick = closeModal;
  document.getElementById("mbg").onclick = e => { if (e.target.id === "mbg") closeModal(); };
  document.getElementById("mok").onclick = async () => {
    const vals = {};
    for (const f of (modal.fields || [])) {
      const sel = document.getElementById("s_" + f.key);
      const el = document.getElementById("f_" + f.key);
      if (sel && sel.value !== "__new__") vals[f.key] = sel.value;
      else vals[f.key] = el ? el.value : "";
    }
    const fn = modal.onSubmit;
    closeModal();
    try { await fn(vals); }
    catch (e) { status = { type:"err", msg:"エラー: " + e.message }; render(); }
  };
}

// ---------- render ----------
function filtered() {
  let pool = [...itemMap.values()];
  if (!showHidden) pool = pool.filter(i => !i.hidden);
  if (activeCat !== "全て") pool = pool.filter(i => (i.category || "その他") === activeCat);
  if (query.trim()) {
    const q = query.trim().toLowerCase();
    pool = pool.filter(i => i.item.toLowerCase().includes(q));
  }
  return pool;
}

// ---------- material master ----------
// Materials have no records of their own: they exist as the rows attached to
// items. Editing one here therefore rewrites every row carrying that name, so
// a change shows up in all the items that use it.
function renderMatList() {
  const el = document.getElementById("list");
  el.innerHTML = "";

  const add = document.createElement("button");
  add.className = "item-btn";
  add.style.color = "#3F7D4A";
  add.style.fontWeight = "600";
  add.innerHTML = '<span class="left">＋ 資材を追加</span>';
  add.onclick = () => masterMaterialModal(null);
  el.appendChild(add);

  let mats = knownMaterials();
  if (query.trim()) {
    const q = query.trim().toLowerCase();
    mats = mats.filter(m =>
      m.material_name.toLowerCase().includes(q) ||
      (m.material_category || "").toLowerCase().includes(q) ||
      (m.supplier || "").toLowerCase().includes(q));
  }
  if (!mats.length) {
    el.insertAdjacentHTML("beforeend",
      '<div style="padding:24px;text-align:center;font-size:13px;color:#9A9382">該当する資材がありません</div>');
    return;
  }

  const byCat = new Map();
  for (const m of mats) {
    const k = m.material_category || "未分類";
    if (!byCat.has(k)) byCat.set(k, []);
    byCat.get(k).push(m);
  }
  for (const [k, list] of byCat) {
    const h = document.createElement("div");
    h.className = "cat-head";
    h.style.color = "#5A5648";
    h.innerHTML = '<span class="dot" style="background:#8A8371"></span>' + esc(k);
    const ren = document.createElement("button");
    ren.className = "sortbtn";
    ren.textContent = "区分名を変更";
    ren.style.color = "#5A5648";
    ren.style.borderColor = "#D8D2C0";
    ren.onclick = e => { e.stopPropagation(); matCategoryModal(k); };
    const arrangingM = arrangeMatCat === k;
    const sortM = document.createElement("button");
    sortM.className = "sortbtn";
    sortM.textContent = arrangingM ? "並び替え終了" : "並び替え";
    sortM.style.color = "#5A5648";
    sortM.style.borderColor = "#D8D2C0";
    sortM.onclick = e => {
      e.stopPropagation();
      arrangeMatCat = arrangingM ? null : k;
      render();
    };
    h.appendChild(sortM);
    const addHere = document.createElement("button");
    addHere.className = "sortbtn";
    addHere.textContent = "＋この区分に追加";
    addHere.style.color = "#3F7D4A";
    addHere.style.borderColor = "#3F7D4A";
    addHere.onclick = e => { e.stopPropagation(); masterMaterialModal(null, k); };
    h.appendChild(addHere);
    h.appendChild(ren);
    el.appendChild(h);
    for (const m of list) {
      const b = document.createElement("button");
      b.className = "item-btn" + (arrangingM ? " dragrow" : "");
      b.dataset.mat = m.material_name;
      if (selectedMat === m.material_name && !arrangingM) {
        b.style.background = "#fff";
        b.style.color = "#2B2A24";
        b.style.fontWeight = "600";
        b.style.borderLeftColor = "#5A5648";
      }
      const ph = photoSrc(matPhotos[m.material_name]);
      const th = ph ? '<img class="thumb" src="' + esc(ph) + '" onerror="this.style.display=\'none\'" />' : "";
      const grip = arrangingM ? '<span class="grip">☰</span>' : "";
      b.innerHTML = '<span class="left">' + grip + th + esc(m.material_name) +
                    '</span><span class="count">' + m.uses + "</span>";
      if (arrangingM) {
        b.draggable = true;
        attachMatDrag(b, el);
      } else {
        b.onclick = () => {
          rememberScroll();
          selectedMat = m.material_name;
          status = null;
          if (window.innerWidth < 768) {
            document.getElementById("sidebar").classList.add("hidden");
            document.getElementById("main").classList.remove("hidden");
          }
          render();
        };
      }
      el.appendChild(b);
    }
  }
}

// Same drag behaviour as the item list, but keyed on material names.
function attachMatDrag(node, listEl) {
  let dragging = false;

  function rowsIn() { return [...listEl.querySelectorAll(".dragrow")]; }
  function commit() {
    const names = rowsIn().map(n => n.dataset.mat);
    withSave(async () => { applyMatOrder(names); }, "並び順を保存しました");
  }
  function moveTo(clientY) {
    const others = rowsIn().filter(n => n !== node);
    for (const o of others) {
      const r = o.getBoundingClientRect();
      if (clientY < r.top + r.height / 2) { listEl.insertBefore(node, o); return; }
    }
    const last = others[others.length - 1];
    if (last) listEl.insertBefore(node, last.nextSibling);
  }

  node.addEventListener("dragstart", e => {
    dragging = true;
    node.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", node.dataset.mat); } catch (err) {}
  });
  node.addEventListener("dragover", e => e.preventDefault());
  node.addEventListener("drag", e => { if (e.clientY) moveTo(e.clientY); });
  node.addEventListener("dragend", () => {
    node.classList.remove("dragging");
    if (dragging) { dragging = false; commit(); }
  });

  let touching = false;
  node.addEventListener("touchstart", () => { touching = true; node.classList.add("dragging"); }, { passive:true });
  node.addEventListener("touchmove", e => {
    if (!touching) return;
    e.preventDefault();
    moveTo(e.touches[0].clientY);
  }, { passive:false });
  node.addEventListener("touchend", () => {
    if (!touching) return;
    touching = false;
    node.classList.remove("dragging");
    commit();
  });
}

function renderCats() {
  const el = document.getElementById("cats");
  el.innerHTML = "";
  for (const c of ["全て", ...allCats()]) {
    const b = document.createElement("button");
    b.className = "cat-btn" + (activeCat === c ? " active" : "");
    b.textContent = c;
    if (activeCat === c) b.style.background = c === "全て" ? "#3F7D4A" : color(c);
    b.onclick = () => { activeCat = c; render(); };
    el.appendChild(b);
  }
  // Editing a category is offered only while that category is the active
  // filter, so the row of chips stays readable.
  if (activeCat !== "全て") {
    const edit = document.createElement("button");
    edit.className = "cat-btn";
    edit.textContent = "✎ " + activeCat + " を編集";
    edit.style.borderColor = color(activeCat);
    edit.style.color = color(activeCat);
    edit.onclick = () => categoryFormModal(activeCat);
    el.appendChild(edit);
  }
  const hiddenCount = [...itemMap.values()].filter(i => i.hidden).length;

  // Multi-select is always available from the normal list, so items can be
  // hidden (or brought back) without opening each one.
  const pk = document.createElement("button");
  pk.className = "cat-btn" + (picking ? " active" : "");
  pk.textContent = picking ? "選択をやめる" : "☑ まとめて選ぶ";
  if (picking) pk.style.background = "#3F7D4A";
  pk.onclick = () => {
    picking = !picking;
    picked.clear();
    arrangeCat = null;
    if (picking) showHidden = true;   // so hidden ones can be ticked too
    render();
  };
  el.appendChild(pk);

  if (picking) {
    const n = picked.size;
    const hideAll = document.createElement("button");
    hideAll.className = "cat-btn";
    hideAll.textContent = "非表示にする (" + n + ")";
    hideAll.style.borderColor = "#B5552F";
    hideAll.style.color = "#B5552F";
    hideAll.onclick = () => {
      if (!n) { alert("非表示にしたい品目にチェックを入れてください。"); return; }
      const names = [...picked];
      withSave(async () => {
        for (const nm of names) setHidden(nm, true);
        picked.clear();
      }, names.length + " 件を非表示にしました");
    };
    el.appendChild(hideAll);

    const showAll = document.createElement("button");
    showAll.className = "cat-btn";
    showAll.textContent = "再表示する (" + n + ")";
    showAll.style.borderColor = "#3F7D4A";
    showAll.style.color = "#3F7D4A";
    showAll.onclick = () => {
      if (!n) { alert("再表示したい品目にチェックを入れてください。"); return; }
      const names = [...picked];
      withSave(async () => {
        for (const nm of names) setHidden(nm, false);
        picked.clear();
      }, names.length + " 件を再表示しました");
    };
    el.appendChild(showAll);

    const allBtn = document.createElement("button");
    const visibleNow = filtered();
    const allTicked = visibleNow.length && visibleNow.every(i => picked.has(i.item));
    allBtn.className = "cat-btn";
    allBtn.textContent = allTicked ? "選択を解除" : "表示中をすべて選ぶ";
    allBtn.onclick = () => {
      if (allTicked) picked.clear();
      else visibleNow.forEach(i => picked.add(i.item));
      render();
    };
    el.appendChild(allBtn);
  }

  if (hiddenCount) {
    const t = document.createElement("button");
    t.className = "cat-btn" + (showHidden ? " active" : "");
    t.textContent = (showHidden ? "非表示を隠す" : "非表示も表示") + " (" + hiddenCount + ")";
    if (showHidden) t.style.background = "#8A8371";
    t.onclick = () => { showHidden = !showHidden; render(); };
    el.appendChild(t);
  }

  const add = document.createElement("button");
  add.className = "cat-btn";
  add.textContent = "＋ 分類を追加";
  add.style.borderColor = "#3F7D4A";
  add.style.color = "#3F7D4A";
  add.onclick = () => categoryFormModal(null);
  el.appendChild(add);
}

      '<div style="padding:24px;text-align:center;font-size:13px;color:#9A9382">該当する品目がありません</div>');
    return;

  const byCat = new Map();

  for (const [c, list] of byCat) {

    h.className = "cat-head";
    h.style.color = color(c);
    h.innerHTML = '<span class="dot" style="background:' + color(c) + '"></span>' + esc(c);
    if (!picking) {
      const sortBtn = document.createElement("button");
      sortBtn.className = "sortbtn";
      sortBtn.textContent = arranging ? "並び替え終了" : "並び替え";
      sortBtn.style.color = color(c);
      sortBtn.style.borderColor = color(c);
      sortBtn.onclick = e => {
        e.stopPropagation();
        arrangeCat = arranging ? null : c;
        render();
      };
      h.appendChild(sortBtn);
    }
    el.appendChild(h);

    const sorted = sortInCat(list);
    for (const i of sorted) {
      const b = document.createElement("button");
      b.className = "item-btn" + (arranging ? " dragrow" : "");
      b.dataset.item = i.item;
      if (i.hidden) b.style.opacity = "0.45";
      if (selected === i.item && !arranging) {
        b.style.background = "#fff"; b.style.color = "#2B2A24";
        b.style.fontWeight = "600"; b.style.borderLeftColor = color(c);
      }
      const firstPhoto = photoSrc(photosOf(i.item)[0]);
      const th = firstPhoto
        ? '<img class="thumb" src="' + esc(firstPhoto) + '" onerror="this.style.display=\'none\'" />' : "";
      const grip = arranging ? '<span class="grip">☰</span>' : "";
      const eye = i.hidden ? '<span class="hidetag">非表示</span>' : "";
      const box = picking
        ? '<span class="tick">' + (picked.has(i.item) ? "☑" : "☐") + "</span>" : "";
      b.innerHTML = '<span class="left">' + box + grip + th + esc(i.item) + eye +
                    '</span><span class="count">' + i.materials.length + "</span>";
      if (picking) {
        if (picked.has(i.item)) b.style.background = "#E7F1E4";
        b.onclick = () => {
          if (picked.has(i.item)) picked.delete(i.item); else picked.add(i.item);
          render();
        };
      } else if (arranging) {
        b.draggable = true;
        attachDrag(b, el, c);
      } else {
        b.onclick = () => {
          rememberScroll();
          selected = i.item; status = null;
          if (window.innerWidth < 768) {
            document.getElementById("sidebar").classList.add("hidden");
            document.getElementById("main").classList.remove("hidden");
          }
          render();
        };
      }
      el.appendChild(b);
    }
  }
}

// Drag-to-reorder, working with both mouse and touch. The row follows the
// finger and swaps places with whatever it is dragged over; on release the
// new order is written back to the rows and saved.
function attachDrag(node, listEl, catName) {
  let dragging = false, placeholderNext = null;

  function rowsInCat() {
    return [...listEl.querySelectorAll(".dragrow")];
  }
  function commit() {
    const names = rowsInCat().map(n => n.dataset.item);
    withSave(async () => { applyOrder(catName, names); }, "並び順を保存しました");
  }
  function moveTo(clientY) {
    const others = rowsInCat().filter(n => n !== node);
    for (const o of others) {
      const r = o.getBoundingClientRect();
      const mid = r.top + r.height / 2;
      if (clientY < mid) { listEl.insertBefore(node, o); return; }
    }
    const last = others[others.length - 1];
    if (last) listEl.insertBefore(node, last.nextSibling);
  }

  node.addEventListener("dragstart", e => {
    dragging = true;
    node.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", node.dataset.item); } catch (err) {}
  });
  node.addEventListener("dragover", e => e.preventDefault());
  node.addEventListener("drag", e => { if (e.clientY) moveTo(e.clientY); });
  node.addEventListener("dragend", () => {
    node.classList.remove("dragging");
    if (dragging) { dragging = false; commit(); }
  });

  let touching = false;
  node.addEventListener("touchstart", () => { touching = true; node.classList.add("dragging"); }, { passive:true });
  node.addEventListener("touchmove", e => {
    if (!touching) return;
    e.preventDefault();
    moveTo(e.touches[0].clientY);
  }, { passive:false });
  node.addEventListener("touchend", () => {
    if (!touching) return;
    touching = false;
    node.classList.remove("dragging");
    commit();
  });
}
